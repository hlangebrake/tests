<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161310">
<title>Die Verschwörung im Senat</title>
<style>:root {
  --ink: #1d1915;
  --paper: #e8d5ae;
  --paper-light: #f4e6c7;
  --bronze: #a77a3e;
  --bronze-light: #d6ad6c;
  --bronze-dark: #5f4022;
  --stone: #413d36;
  --stone-dark: #171512;
  --wine: #6f2e2e;
  --wine-deep: #3c1718;
  --cream: #f6ecd5;
  --muted: #b7ad9a;
  --safe: #7f9b78;
  --danger: #9a5b52;
  --shadow: 0 18px 55px rgba(0,0,0,.38);
  --display: Georgia, 'Times New Roman', serif;
  --body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: clamp(15px, 1.25vw, 18px);
}

* { box-sizing: border-box; }
html, body, #app { margin: 0; min-height: 100%; width: 100%; }
body {
  min-height: 100dvh;
  overflow-x: hidden;
  font-family: var(--body);
  color: var(--cream);
  background: #141210;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; }
button { touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid #f2cf87; outline-offset: 3px; }
button:disabled { opacity: .4; cursor: not-allowed; }

.primary-btn, .secondary-btn, .danger-quiet, .text-btn {
  min-height: 48px;
  border-radius: 8px;
  padding: .72rem 1.15rem;
  border: 1px solid transparent;
  font-weight: 750;
  cursor: pointer;
}
.primary-btn {
  color: #17110a;
  background: linear-gradient(#e0b974, #ad7b3e);
  border-color: #edcf94;
  box-shadow: inset 0 1px rgba(255,255,255,.35), 0 7px 18px rgba(0,0,0,.28);
}
.secondary-btn { color: var(--cream); background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.25); }
.danger-quiet { color: #ffd7ce; background: rgba(116,42,39,.22); border-color: rgba(209,122,104,.45); }
.text-btn { color: #7a4f24; background: transparent; text-decoration: underline; text-underline-offset: 4px; }

.eyebrow { margin: 0 0 .55rem; text-transform: uppercase; letter-spacing: .19em; font-weight: 800; font-size: .72rem; color: #d5b475; }
.eyebrow.dark { color: #744c25; }

/* Landing */
.landing-shell {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  position: relative;
  padding: 4vw;
  overflow: hidden;
  background:
    radial-gradient(circle at 72% 26%, rgba(182,107,47,.26), transparent 30%),
    linear-gradient(115deg, rgba(7,7,6,.25), rgba(0,0,0,.76)),
    repeating-linear-gradient(92deg, #38342e 0 3px, #312e29 3px 8px, #35312b 8px 15px);
}
.landing-vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 16vw rgba(0,0,0,.86); }
.landing-card {
  width: min(760px, 92vw);
  padding: clamp(2rem, 5vw, 4.2rem);
  text-align: center;
  position: relative;
  border: 1px solid rgba(224,185,116,.42);
  background: linear-gradient(rgba(26,21,17,.92), rgba(18,15,13,.94));
  box-shadow: var(--shadow);
}
.landing-card::before, .landing-card::after { content: ''; position: absolute; width: 46px; height: 46px; border-color: var(--bronze); opacity: .6; }
.landing-card::before { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
.landing-card::after { right: 12px; bottom: 12px; border-right: 2px solid; border-bottom: 2px solid; }
.spqr-mark { width: 74px; height: 74px; margin: 0 auto 1.1rem; display: grid; place-items: center; border: 2px solid #b98849; border-radius: 50%; color: #ddb975; font: 700 .88rem var(--display); letter-spacing: .06em; box-shadow: inset 0 0 0 7px rgba(185,136,73,.1); }
.landing-card h1 { margin: 0; font: 700 clamp(2.5rem, 6vw, 5.1rem)/.93 var(--display); letter-spacing: -.04em; }
.landing-card h1 span { color: #d1a566; }
.landing-copy { max-width: 610px; margin: 1.45rem auto 1.8rem; color: #d8d0c0; line-height: 1.6; }
.landing-actions { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; }
.landing-actions button { min-width: 190px; }
.landing-note { margin: 1.25rem 0 0; font-size: .78rem; color: #8e877b; }

/* App shell */
.game-shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; background: var(--stone-dark); }
.topbar {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: max(.7rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .7rem max(1rem, env(safe-area-inset-left));
  background: linear-gradient(#201d19, #151311);
  border-bottom: 1px solid rgba(212,172,105,.22);
  z-index: 5;
}
.objective-wrap { min-width: 0; display: grid; gap: .2rem; }
.location-label { color: #d7b374; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 800; }
.objective { font-size: .94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: .45rem; }
.icon-btn {
  min-width: 62px; min-height: 50px; color: #eee1c8; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; cursor: pointer; display: grid; place-items: center; grid-template-columns: auto; padding: .25rem .6rem;
}
.icon-btn > span:first-child { font-weight: 900; font-size: 1.15rem; line-height: 1; }
.icon-label { font-size: .64rem; color: #bdb3a2; }
.menu-lines { width: 22px; height: 14px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; }
.menu-lines::after { content:''; position:absolute; left:0; right:0; top:5px; border-top:2px solid currentColor; }

.world { min-height: 0; position: relative; overflow: hidden; background: #24211c; }
.scene { min-height: 100%; height: 100%; position: relative; padding: clamp(1.2rem, 2.7vw, 2.6rem); overflow: auto; }
.inventory-bar {
  min-height: 92px;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .65rem max(1rem, env(safe-area-inset-right)) max(.65rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  background: linear-gradient(#171411, #0f0e0d);
  border-top: 1px solid rgba(212,172,105,.28);
  z-index: 4;
}
.inventory-title { flex: 0 0 auto; text-transform: uppercase; letter-spacing: .17em; font-size: .68rem; color: #a98c5d; font-weight: 850; }
.inventory-items { display: flex; gap: .55rem; overflow-x: auto; padding: .18rem .1rem; scrollbar-width: thin; }
.inventory-item { min-height: 58px; min-width: 150px; max-width: 205px; padding: .45rem .65rem; display: grid; grid-template-columns: 34px 1fr; gap: .5rem; align-items: center; color: #e6dbc6; background: #28231d; border: 1px solid #554734; border-radius: 8px; text-align: left; cursor: pointer; font-size: .73rem; }
.inventory-item.selected { border-color: #d6aa67; box-shadow: inset 0 0 0 1px #d6aa67; }
.inventory-symbol { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #2b1d0f; background: #b98a4e; font: 800 .72rem var(--display); }
.inventory-empty { color: #706b62; font-size: .8rem; }

/* Generic scenes */
.prolog-scene { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(230px, .55fr); gap: 3vw; align-items: center; background: radial-gradient(circle at 35% 40%, rgba(177,105,48,.18), transparent 33%), linear-gradient(110deg,#302a23,#151310); }
.intercept-table { color: #281e14; width: min(680px, 100%); justify-self: center; padding: clamp(1.7rem,4vw,3.4rem); background: linear-gradient(96deg,#e8d3a9,#d7bd8e); box-shadow: 0 18px 55px #0009, inset 0 0 45px #8e61222b; transform: rotate(-.5deg); position: relative; }
.intercept-table::after { content:''; position:absolute; inset:10px; border:1px solid rgba(101,65,31,.27); pointer-events:none; }
.intercept-table h2 { font: 700 clamp(1.55rem,3vw,2.7rem)/1.16 var(--display); margin: 0 0 1rem; }
.intercept-table p { line-height: 1.55; }
.seal-mark { position:absolute; right:8%; top:10%; width:68px; height:68px; border-radius:50%; display:grid; place-items:center; background:#7e2c2d; color:#e8c6a0; font:700 1.8rem var(--display); box-shadow:0 4px 9px #0007, inset 0 0 0 5px #4e1b1b55; }
.story-aside { align-self: end; padding: 1.2rem; border-left: 3px solid #b08449; background: rgba(0,0,0,.28); display:grid; gap:.5rem; color:#d5c9b6; line-height:1.5; }
.story-aside strong { color:#d6ad6c; text-transform:uppercase; letter-spacing:.13em; font-size:.74rem; }

.forum-scene { display:grid; place-items:center; background: radial-gradient(circle at 50% 0%, rgba(204,152,79,.16), transparent 40%), linear-gradient(#625e56 0 18%, #34312b 18% 100%); }
.forum-columns::before, .forum-columns::after { content:''; position:absolute; top:8%; bottom:0; width:12%; background:repeating-linear-gradient(90deg,#777269 0 12px,#625e56 12px 18px); opacity:.38; }
.forum-columns::before { left:3%; } .forum-columns::after { right:3%; }
.gate-panel { width:min(820px,88vw); padding:clamp(1.25rem,3vw,2.2rem); text-align:center; background:linear-gradient(#2b2925,#1b1916); border:1px solid #75634b; box-shadow:0 18px 70px #000a, inset 0 0 0 7px #0003; position:relative; z-index:1; }
.gate-heading { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; border-bottom:1px solid #715b3c; padding-bottom:.8rem; margin-bottom:1rem; }
.gate-heading span { font:700 1.45rem var(--display); letter-spacing:.09em; color:#d3b174; }
.gate-heading small { color:#8d8476; }
.stone-clue strong { display:block; font:800 clamp(1.6rem,3vw,2.5rem) var(--display); margin:.3rem 0 .8rem; }
.stone-clue > span { color:#9e9282; font-size:.75rem; text-transform:uppercase; letter-spacing:.15em; }
.code-track { display:flex; justify-content:center; gap:.5rem; margin-bottom:1.2rem; }
.code-slot { width:48px; height:48px; display:grid; place-items:center; border:1px solid #6a5942; background:#15130f; font:700 1.15rem ui-monospace, monospace; color:#dfba7c; }
.plaque-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; }
.latin-plaque { min-height:110px; border:1px solid #746957; color:#eee4d2; background:linear-gradient(#524e46,#393630); display:grid; place-items:center; align-content:center; gap:.3rem; cursor:pointer; box-shadow:inset 0 0 25px #0003; }
.latin-plaque span { font:700 1rem var(--display); letter-spacing:.08em; }
.latin-plaque strong { color:#d7b273; font-size:1.7rem; }
.scene-instruction { margin:1rem 0 0; color:#aea392; font-size:.8rem; }
.inspect-hotspot { position:absolute; bottom:7%; right:8%; min-width:150px; min-height:48px; color:#26190d; background:#d9bf8b; border:1px solid #f2d8a3; transform:rotate(1deg); box-shadow:0 7px 19px #0008; cursor:pointer; font-weight:750; }
.shake { animation:shake .28s linear; }

.archive-scene { display:grid; place-items:center; background: linear-gradient(rgba(13,12,10,.35),rgba(13,12,10,.72)), repeating-linear-gradient(90deg,#44372a 0 5px,#3b3026 5px 60px,#322920 60px 65px); }
.archive-workbench, .wax-tablet-panel { width:min(900px,92vw); padding:clamp(1.2rem,2.5vw,2rem); background:rgba(20,17,13,.9); border:1px solid #6d5637; box-shadow:var(--shadow); }
.archive-workbench h2, .wax-tablet-panel h2 { font:700 clamp(1.7rem,3vw,2.6rem) var(--display); margin:.2rem 0 .4rem; }
.loose-tags { min-height:70px; display:flex; gap:.7rem; flex-wrap:wrap; padding:1rem 0; }
.paper-tag { min-width:120px; min-height:52px; padding:.6rem 1rem; color:#352719; background:#dcc59a; border:1px solid #f0dcaf; box-shadow:0 5px 14px #0005; cursor:pointer; transform:rotate(-1deg); }
.paper-tag:nth-child(even) { transform:rotate(1.3deg); }
.paper-tag.selected { outline:3px solid #d3a85f; outline-offset:2px; }
.shelf-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.65rem; }
.archive-shelf { min-height:80px; padding:1rem; text-align:left; color:#e7dcc8; background:linear-gradient(#2e261d,#201a15); border:1px solid #65513b; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.archive-shelf span { font:700 1.05rem var(--display); letter-spacing:.08em; }
.archive-shelf small { color:#887d6c; }
.archive-shelf.filled { opacity:.52; }
.wax-tablet-panel { color:#2f2418; background:linear-gradient(#dfc692,#c9aa72); border:8px solid #6e4c2d; box-shadow:var(--shadow), inset 0 0 45px #6c461b33; }
.seal-form { display:grid; gap:1rem; margin-top:1.2rem; }
.wax-input { display:grid; grid-template-columns:minmax(180px,.65fr) 1fr; gap:1rem; align-items:center; }
.wax-input span { font-weight:850; letter-spacing:.08em; }
.wax-input input, .inline-form input, .practice-card input, .guard-review input { width:100%; min-height:52px; border:1px solid #745738; border-radius:5px; padding:.7rem .85rem; color:#271b10; background:#f2e4c7; }
.wax-input.solved input { color:#27472f; background:#d8ddbf; }

.messenger-scene { display:grid; place-items:center; background:radial-gradient(circle at 25% 28%,rgba(218,159,80,.14),transparent 24%), linear-gradient(130deg,#30271f,#171411); }
.dispatch-board { width:min(880px,92vw); padding:clamp(1.2rem,3vw,2.4rem); background:linear-gradient(#c8aa78,#a98555); color:#25190f; border:10px solid #593b24; box-shadow:var(--shadow), inset 0 0 50px #5f391833; }
.dispatch-copy h2 { margin:.2rem 0 .5rem; font:700 clamp(1.4rem,3vw,2.3rem) var(--display); }
.order-slots { display:grid; grid-template-columns:repeat(4,1fr); gap:.65rem; margin:1.3rem 0 .9rem; }
.order-slot { min-height:64px; border:2px dashed #6a4c30; background:rgba(247,227,189,.35); color:#342215; font-weight:800; cursor:pointer; }
.verb-cards { display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
.verb-card { min-width:130px; min-height:56px; color:#ead8b8; background:#4b3020; border:1px solid #826043; box-shadow:0 4px 10px #0005; cursor:pointer; font-family:var(--display); letter-spacing:.06em; }
.courier-lock { width:min(850px,92vw); display:grid; grid-template-columns:minmax(220px,.75fr) 1.25fr; gap:2rem; align-items:center; padding:clamp(1.5rem,4vw,3rem); background:#1e1a16; border:1px solid #765737; box-shadow:var(--shadow); }
.courier-lock h2 { font:700 clamp(1.6rem,3.2vw,2.6rem) var(--display); margin:.2rem 0 .5rem; }
.bronze-dial { aspect-ratio:1; max-width:280px; margin:auto; border-radius:50%; border:18px solid #6a4828; box-shadow:inset 0 0 0 5px #b6884f, inset 0 0 40px #0007, 0 10px 35px #0008; display:flex; align-items:center; justify-content:space-around; color:#e4c384; background:radial-gradient(circle,#51361f,#241a12); font-family:var(--display); }
.inline-form { display:flex; gap:.6rem; align-items:center; }
.inline-form.vertical { flex-direction:column; align-items:stretch; }

.files-scene { background:linear-gradient(rgba(20,17,13,.55),rgba(20,17,13,.8)), repeating-linear-gradient(0deg,#4b3929 0 4px,#3a2c21 4px 45px); }
.informant-strip { width:min(960px,95vw); margin:0 auto 1.3rem; padding:1rem 1.2rem; display:flex; gap:1rem; align-items:center; color:#302216; background:#e1cda5; border-left:5px solid #7b2e2e; box-shadow:0 8px 25px #0007; }
.informant-strip strong { flex:0 0 auto; text-transform:uppercase; letter-spacing:.1em; font-size:.75rem; }
.dossier-grid { width:min(1050px,96vw); margin:auto; display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; }
.dossier { min-width:0; display:grid; gap:.5rem; }
.dossier-open { min-height:300px; position:relative; padding:1rem; color:#332316; background:linear-gradient(98deg,#d4b989,#bc9560); border:1px solid #ead0a0; box-shadow:0 14px 30px #0007; cursor:pointer; text-align:left; overflow:hidden; }
.dossier-tab { display:block; font-size:.62rem; letter-spacing:.11em; font-weight:800; color:#6c4122; }
.portrait-silhouette, .portrait-large { display:block; width:80px; height:100px; margin:2rem auto 1.2rem; border-radius:50% 50% 42% 42%; background:radial-gradient(circle at 50% 28%,#5a4939 0 24%,transparent 25%), linear-gradient(90deg,transparent 20%,#5a4939 20% 80%,transparent 80%); opacity:.75; }
.dossier-open strong { display:block; font:700 1.5rem var(--display); text-align:center; }
.dossier-open small { display:block; text-align:center; margin-top:.3rem; color:#6d563e; }
.mark-suspect { min-height:48px; color:#e9d7b8; background:#251c16; border:1px solid #705438; cursor:pointer; }
.dossier-inspection { color:#2d2015; max-width:780px; margin:auto; padding:1.2rem; background:#e1c89b; }
.portrait-large { width:120px; height:150px; }
.trait-list { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; padding:1rem; background:#c7aa78; }
.trait-list span { color:#6e4c2e; font-size:.75rem; letter-spacing:.12em; }
.trait-list strong { font-family:var(--display); }

.senate-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 12%,rgba(226,182,109,.18),transparent 35%), linear-gradient(#4b4944 0 25%,#26231f 25% 100%); }
.senate-depth { position:absolute; left:7%; right:7%; top:4%; height:30%; border-radius:50% 50% 0 0; border:2px solid #706d65; opacity:.35; }
.senate-mechanism { width:min(920px,92vw); padding:clamp(1.5rem,3vw,2.6rem); text-align:center; position:relative; z-index:1; background:linear-gradient(#251f19,#171310); border:1px solid #796042; box-shadow:var(--shadow); }
.senate-mechanism h2 { font:700 clamp(1.5rem,3.2vw,2.5rem) var(--display); }
.lever-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin:1.4rem 0; }
.bronze-lever { min-height:160px; padding:1rem; color:#eddcbd; background:linear-gradient(#493421,#291d13); border:1px solid #8c6841; cursor:pointer; display:grid; place-items:center; gap:.8rem; }
.lever-handle { display:block; width:32px; height:72px; border-radius:16px; background:linear-gradient(90deg,#5d3b1f,#c09152,#644123); box-shadow:0 8px 14px #0007; transform:rotate(-7deg); transform-origin:bottom; }
.bronze-lever strong { font:700 .92rem var(--display); letter-spacing:.06em; }
.mechanism-progress { display:flex; justify-content:center; gap:.7rem; }
.mechanism-light { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#3f3327; border:1px solid #71583b; color:#786a58; }
.mechanism-light.on { color:#2d2112; background:#d0a35d; box-shadow:0 0 18px #c69348aa; }

.final-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 20%,rgba(162,88,44,.2),transparent 30%), linear-gradient(130deg,#261b16,#0e0c0a); }
.cipher-desk, .final-document { width:min(1000px,94vw); padding:clamp(1.3rem,3vw,2.5rem); color:#2b2016; background:linear-gradient(96deg,#ead9b6,#cfb181); box-shadow:0 18px 60px #000b, inset 0 0 65px #8f5b2633; }
.cipher-desk h2, .final-document h2 { margin:.2rem 0 1rem; font:700 clamp(1.5rem,3vw,2.5rem) var(--display); }
.cipher-layout { display:grid; grid-template-columns:1.3fr .7fr; gap:1rem; }
.meaning-list { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; }
.meaning-slot { min-height:72px; padding:.7rem 1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; color:#3a2a1c; background:rgba(255,255,255,.25); border:1px dashed #866342; cursor:pointer; text-align:left; }
.meaning-slot strong { font-family:var(--display); color:#793f2f; }
.meaning-slot.filled { background:#d7d7b5; border-style:solid; }
.word-bank { align-content:start; display:flex; flex-wrap:wrap; gap:.55rem; }
.wax-chip { min-width:105px; min-height:52px; padding:.5rem .8rem; border-radius:22px; color:#f1d0ad; background:#713133; border:2px solid #4b1e20; box-shadow:inset 0 0 0 4px #8d464766, 0 5px 12px #0005; cursor:pointer; font-family:var(--display); }
.wax-chip.selected { outline:4px solid #7a5228; outline-offset:3px; }
.solved-final .final-document { max-width:760px; }

.transition-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 40%,rgba(177,124,67,.18),transparent 32%),linear-gradient(#2f2a23,#151310); }
.transition-card { width:min(620px,90vw); text-align:center; padding:2.5rem; border:1px solid #6d583d; background:rgba(22,18,14,.9); box-shadow:var(--shadow); }
.transition-card h2 { font:700 2rem var(--display); margin:.3rem 0 .6rem; }
.transition-card p { color:#c2b7a5; line-height:1.55; }
.success-glyph { width:65px; height:65px; margin:auto; border-radius:50%; display:grid; place-items:center; color:#24190f; background:#c39451; font-size:2rem; }

/* Results */
.results-scene { min-height:100%; overflow:auto; padding:clamp(1.2rem,3vw,2.6rem); background:linear-gradient(#201914,#100f0d); }
.mission-banner { width:min(1050px,96vw); margin:0 auto 1.1rem; padding:1.8rem 2rem; border:1px solid #6e5636; background:radial-gradient(circle at 90% 50%,rgba(164,99,44,.2),transparent 30%),#211b16; }
.mission-banner h1 { margin:.1rem 0 .3rem; font:700 clamp(2rem,4vw,3.5rem) var(--display); color:#e2c08a; }
.mission-banner p:last-child { color:#d1c7b7; }
.analysis-panel { width:min(1050px,96vw); margin:auto; }
.analysis-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; margin-bottom:1rem; }

const VOCAB_BY_ID = Object.fromEntries(VOCABULARY.map(v => [v.id, v]));

function normalizeAnswer(value = '') {
  return value
    .toLocaleLowerCase('de-DE')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/ß/g, 'ss')
    .replace(/[.,;:!?()[\]{}]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function isCorrectAnswer(wordId, direction, answer) {
  const word = VOCAB_BY_ID[wordId];
  if (!word) return false;
  const normalized = normalizeAnswer(answer);
  const accepted = direction === 'g2l' ? word.forms : word.german;
  return accepted.some(v => normalizeAnswer(v) === normalized);
}


// src/diagnostics.js

const STATUS = {
  SAFE: 'SICHER',
  UNSURE: 'UNSICHER',
  NOT_MASTERED: 'NICHT BEHERRSCHT',
  UNTESTED: 'NOCH NICHT GEPRÜFT'
};

function blankWordStats() {
  return {
    encounters: 0,
    correct: 0,
    incorrect: 0,
    unaidedCorrect: 0,
    hints: 0,
    totalResponseMs: 0,
    directions: {
      l2g: { attempts: 0, correct: 0, unaidedCorrect: 0 },
      g2l: { attempts: 0, correct: 0, unaidedCorrect: 0 },
      application: { attempts: 0, correct: 0, unaidedCorrect: 0 }
    },
    status: STATUS.UNTESTED,
    lastSeenAt: null
  };
}

function createDiagnostics() {
  return Object.fromEntries(VOCABULARY.map(v => [v.id, blankWordStats()]));
}

function calculateStatus(stats) {
  if (!stats || stats.encounters === 0) return STATUS.UNTESTED;
  const activeL2G = stats.directions.l2g.unaidedCorrect > 0;
  const activeG2L = stats.directions.g2l.unaidedCorrect > 0;
  const accuracy = stats.correct / Math.max(1, stats.correct + stats.incorrect);

  if (activeL2G && activeG2L && stats.unaidedCorrect >= 2 && accuracy >= 0.75 && stats.incorrect <= 1) {
    return STATUS.SAFE;
  }
  if (stats.incorrect >= 2 && accuracy < 0.5) return STATUS.NOT_MASTERED;
  return STATUS.UNSURE;
}

function recordAttempt(diagnostics, wordId, {
  direction = 'application',
  correct = false,
  usedHint = false,
  responseMs = 0
} = {}) {
  const stats = diagnostics[wordId] || blankWordStats();
  const dir = stats.directions[direction] || stats.directions.application;
  stats.encounters += 1;
  stats.correct += correct ? 1 : 0;
  stats.incorrect += correct ? 0 : 1;
  stats.hints += usedHint ? 1 : 0;
  stats.totalResponseMs += Math.max(0, Math.round(responseMs || 0));
  stats.lastSeenAt = new Date().toISOString();
  dir.attempts += 1;
  dir.correct += correct ? 1 : 0;
  if (correct && !usedHint) {
    stats.unaidedCorrect += 1;
    dir.unaidedCorrect += 1;
  }
  stats.status = calculateStatus(stats);
  diagnostics[wordId] = stats;
  return stats;
}

function markHint(diagnostics, wordIds = []) {
  for (const id of wordIds) {
    const stats = diagnostics[id] || blankWordStats();
    stats.hints += 1;
    diagnostics[id] = stats;
  }
}

function summarizeDiagnostics(diagnostics) {
  const groups = {
    [STATUS.SAFE]: [],
    [STATUS.UNSURE]: [],
    [STATUS.NOT_MASTERED]: [],
    [STATUS.UNTESTED]: []
  };
  for (const word of VOCABULARY) {
    const stats = diagnostics[word.id] || blankWordStats();
    stats.status = calculateStatus(stats);
    groups[stats.status].push({ ...word, stats });
  }
  return groups;
}

}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.version !== 1) return null;
    return parsed;
  } catch {
    return null;
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch {
    return false;
  }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch { /* storage may be unavailable */ }
}

function addInventory(state, itemId) {
  if (!state.inventory.includes(itemId)) state.inventory.push(itemId);

function solvePuzzle(state, puzzleId) {
  if (!state.solvedPuzzles.includes(puzzleId)) state.solvedPuzzles.push(puzzleId);

function isSolved(state, puzzleId) {

}

// src/sound.js
let ctx = null;

function getContext() {
  if (!ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) ctx = new AudioCtx();
  }
  return ctx;
}

function playSound(kind, enabled = true) {
  if (!enabled) return;
  const audio = getContext();
  if (!audio) return;
  const now = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const map = {
    tap: [320, 0.025, 0.025],
    success: [520, 0.08, 0.05],
    error: [150, 0.06, 0.04],
    unlock: [240, 0.12, 0.08],
    paper: [700, 0.035, 0.02]
  };
  const [freq, duration, volume] = map[kind] || map.tap;
  oscillator.type = kind === 'error' ? 'square' : 'sine';
  oscillator.frequency.setValueAtTime(freq, now);
  if (kind === 'success') oscillator.frequency.exponentialRampToValueAtTime(760, now + duration);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + duration + 0.01);
}

const app = document.querySelector('#app');
let state = loadState() || createInitialState();
let sessionStartedAt = Date.now();
let inspectionCleanup = null;
let adaptiveReviewInFlight = false;

const roomOrder = ['prolog', 'forum', 'archive', 'messengers', 'files', 'senate', 'final', 'results'];

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
}

function persist() {
  saveState(state);
}

function resetSessionClock() {
  sessionStartedAt = Date.now();
}

function elapsedSeconds() {
  if (state.completed) return state.accumulatedSeconds || 0;
  return (state.accumulatedSeconds || 0) + Math.floor((Date.now() - sessionStartedAt) / 1000);
}

function commitClock() {
  state.accumulatedSeconds = elapsedSeconds();
  resetSessionClock();
  persist();
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function puzzleHintCount(id) {
  return state.hintsUsed[id] || 0;
}

function puzzleUsedHint(id) {
  return puzzleHintCount(id) > 0;
}

function record(wordId, direction, correct, puzzleId, responseMs = 0) {
  recordAttempt(state.diagnostics, wordId, {
    direction,
    correct,
    usedHint: puzzleUsedHint(puzzleId),
    responseMs
  });
  if (!correct) queueReview(state, wordId);
  persist();
}

function markPuzzleHints(puzzle) {
  markHint(state.diagnostics, puzzle.wordIds);
}

function startNewGame() {
  clearState();
  state = createInitialState();
  state.started = true;
  state.startedAt = new Date().toISOString();
  sessionStartedAt = Date.now();
  addInventory(state, 'interceptedNote');
  persist();
  render();
}

function continueGame() {
  state.started = true;
  sessionStartedAt = Date.now();
  persist();
  render();
}

            <span class="inventory-symbol" aria-hidden="true">${escapeHtml(item.symbol)}</span>

      </div>
    </footer>`;
}

function wireInventory() {
  app.querySelectorAll('.inventory-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.item;
      if (state.selectedInventoryItem === id) {
        state.selectedInventoryItem = null;

        render();
        return;
      }
      state.selectedInventoryItem = id;
      persist();
      const item = INVENTORY[id];
      openInspection(item.name, `

          <div class="large-object-token">${escapeHtml(item.symbol)}</div>

        <div class="trait-list">
          <span>MERKMALE</span>
          ${s.traits.map(t => `<strong>${t.toUpperCase()}</strong>`).join('')}
          <span>COMES</span><strong>${s.companion.toUpperCase()}</strong>
        </div>
        <p>${escapeHtml(s.note)}</p>
        <button class="secondary-btn" data-close>Akte schließen</button>
      </div>`);
  }));
  world.querySelectorAll('[data-suspect]').forEach(btn => btn.addEventListener('click', () => {
    const chosen = btn.dataset.suspect;
    const ok = chosen === 'lucius';
    for (const id of ['regius', 'audax', 'acer', 'ingens', 'comes']) record(id, 'application', ok, 'suspect', 0);
    if (ok) {
      solvePuzzle(state, 'suspect');
      addInventory(state, 'suspectSeal');
      persist();
      playSound('success', state.soundEnabled);
      toast('Das Siegel stimmt mit der abgefangenen Nachricht überein.');
      setTimeout(render, 500);
    } else {
      playSound('error', state.soundEnabled);
      toast('Die Merkmale widersprechen dem Informantenbericht.');
    }
  }));
}

function renderSenate(world) {
  if (isSolved(state, 'senateTable')) {
    world.innerHTML = completedRoom('Der Abstimmungstisch ist aktiv.', 'Unter der Tischplatte erscheint eine Randnotiz – offenbar der letzte Teil der Verschwörerbotschaft.', 'Randnotiz entschlüsseln', 'final');
    wireCompletedRoom(world);
    return;
  }
  const data = state.puzzleData.senateTable || { step: 0, startedAt: Date.now() };
  state.puzzleData.senateTable = data;
  const prompts = [
    { label: 'Sechs Stimmsteine in zwei Lager TEILEN.', expected: 'dividere' },
    { label: 'Das belastende Siegel DARBIETEN.', expected: 'praebere' },
    { label: 'Den Verdächtigen ERKENNEN.', expected: 'cognoscere' }
  ];
  const levers = ['cognoscere', 'dividere', 'praebere'];
  world.innerHTML = `
    <section class="scene senate-scene">
      <div class="senate-depth" aria-hidden="true"></div>
      <div class="senate-mechanism">
        <p class="eyebrow">Mensae Senatus</p>
        <h2>${escapeHtml(prompts[data.step].label)}</h2>
        <div class="lever-row">
          ${levers.map(l => `<button class="bronze-lever" data-lever="${l}"><span class="lever-handle"></span><strong>${l.toUpperCase()}</strong></button>`).join('')}
        </div>
        <div class="mechanism-progress">${[0,1,2].map(i => `<span class="mechanism-light ${i < data.step ? 'on' : ''}">${i+1}</span>`).join('')}</div>
      </div>
    </section>`;
  world.querySelectorAll('[data-lever]').forEach(btn => btn.addEventListener('click', () => {
    const selected = btn.dataset.lever;
    const expected = prompts[data.step].expected;
    const ok = selected === expected;
    record(selected, 'l2g', ok, 'senateTable', Date.now() - data.startedAt);
    data.startedAt = Date.now();
    if (ok) {
      data.step += 1;
      playSound('tap', state.soundEnabled);
      if (data.step >= prompts.length) {
        solvePuzzle(state, 'senateTable');
        addInventory(state, 'senateSeal');
        persist();
        playSound('unlock', state.soundEnabled);
        toast('Bronzeplatten verschieben sich. Eine geheime Randnotiz wird sichtbar.');
        setTimeout(render, 500);
      } else { persist(); render(); }
    } else {
      playSound('error', state.soundEnabled);
      toast('Der Hebel blockiert. Das ist nicht die geforderte Handlung.');
    }
  }));
}

function renderFinal(world) {
  if (isSolved(state, 'finalCipher')) {
    world.innerHTML = `
      <section class="scene final-scene solved-final">
        <div class="final-document">
          <p class="eyebrow dark">Entschlüsselte Randnotiz</p>
          <h2>„Lucius handelt für sich. Ein anderer Plan war nur Ablenkung.“</h2>
          <p>Die Botschaft, das Siegel und die Botenmarke ergeben zusammen ein eindeutiges Bild.</p>
          <button class="primary-btn" data-action="finish">Beweise dem Senat übergeben</button>
        </div>
      </section>`;
    world.querySelector('[data-action="finish"]').addEventListener('click', () => {
      state.completed = true;
      state.currentRoom = 'results';
      commitClock();
      render();
    });
    return;
  }
  const data = state.puzzleData.finalCipher || { matches: {}, selected: null, startedAt: Date.now() };
  state.puzzleData.finalCipher = data;
  const clues = [
    ['ein anderer', 'alius'], ['Art / Weise', 'modus'], ['verschieden', 'varius'], ['jeder / alle', 'omnis'],
    ['wie zum Beispiel', 'velut'], ['sich', 'sibi'], ['sobald', 'ubi'], ['groß / bedeutend', 'grandis']
  ];
  const pool = ['sibi','grandis','modus','omnis','alius','ubi','varius','velut'];
  world.innerHTML = `
    <section class="scene final-scene">
      <div class="cipher-desk">
        <p class="eyebrow dark">Randnotiz unter dem Senatstisch</p>
        <h2>Acht Siegelplätze sind leer.</h2>
        <div class="cipher-layout">
          <div class="meaning-list">
            ${clues.map(([label, id]) => `<button class="meaning-slot ${data.matches[id] ? 'filled' : ''}" data-slot="${id}"><span>${escapeHtml(label)}</span><strong>${data.matches[id] ? data.matches[id].toUpperCase() : '—'}</strong></button>`).join('')}
          </div>
          <div class="word-bank" aria-label="Lateinische Siegel">
            ${pool.filter(id => !Object.values(data.matches).includes(id)).map(id => `<button class="wax-chip ${data.selected === id ? 'selected' : ''}" data-chip="${id}">${id.toUpperCase()}</button>`).join('')}
          </div>
        </div>
        <p class="scene-instruction">Wähle ein lateinisches Siegel, dann den passenden deutschen Platz.</p>
      </div>
    </section>`;
  world.querySelectorAll('[data-chip]').forEach(btn => btn.addEventListener('click', () => {
    data.selected = btn.dataset.chip;
    playSound('paper', state.soundEnabled);
    persist(); render();
  }));
  world.querySelectorAll('[data-slot]').forEach(btn => btn.addEventListener('click', () => {
    if (!data.selected) { toast('Wähle zuerst ein lateinisches Siegel.'); return; }
    const expected = btn.dataset.slot;
    const selected = data.selected;
    const ok = selected === expected;
    record(selected, 'l2g', ok, 'finalCipher', Date.now() - data.startedAt);
    data.startedAt = Date.now();
    if (ok) {
      data.matches[expected] = selected;
      data.selected = null;
      playSound('tap', state.soundEnabled);
      if (Object.keys(data.matches).length === clues.length) {
        solvePuzzle(state, 'finalCipher');
        persist();
        playSound('success', state.soundEnabled);
        toast('Die Siegel ergeben eine lesbare Randnotiz.');
        setTimeout(render, 550);
      } else { persist(); render(); }
    } else {
      queueReview(state, selected);
      data.selected = null;
      persist();
      playSound('error', state.soundEnabled);
      toast('Das Siegel haftet nicht an dieser Stelle.');
      render();
    }
  }));
}

function renderResults(world) {
  const groups = summarizeDiagnostics(state.diagnostics);
  const count = status => groups[status].length;
  world.innerHTML = `
    <section class="results-scene">
      <div class="mission-banner">
        <p class="eyebrow">Senat · Sitzung gesichert</p>
        <h1>Mission erfolgreich</h1>
        <p>Die Verschwörung wurde rechtzeitig aufgedeckt.</p>
      </div>
      <div class="analysis-panel">
        <div class="analysis-summary">
          <div><strong>${count(STATUS.SAFE)}</strong><span>Sicher</span></div>
          <div><strong>${count(STATUS.UNSURE)}</strong><span>Unsicher</span></div>
          <div><strong>${count(STATUS.NOT_MASTERED)}</strong><span>Noch üben</span></div>
          <div><strong>${formatTime(elapsedSeconds())}</strong><span>Spielzeit</span></div>
        </div>
        <div class="status-columns">
          ${renderStatusColumn('SICHER', groups[STATUS.SAFE], 'safe')}
          ${renderStatusColumn('UNSICHER', groups[STATUS.UNSURE], 'unsure')}
          ${renderStatusColumn('NOCH ÜBEN', [...groups[STATUS.NOT_MASTERED], ...groups[STATUS.UNTESTED]], 'practice')}
        </div>
        <div class="results-actions">
          <button class="primary-btn" data-action="practice">Unsichere Vokabeln trainieren</button>
          <button class="secondary-btn" data-action="restart">Neues Spiel</button>
        </div>
      </div>
    </section>`;
  world.querySelector('[data-action="practice"]').addEventListener('click', startPracticeMode);
  world.querySelector('[data-action="restart"]').addEventListener('click', () => {
    if (window.confirm('Neues Spiel starten? Die aktuelle Auswertung wird ersetzt.')) startNewGame();
  });
}

function renderStatusColumn(title, words, cls) {
  return `<section class="status-column ${cls}"><h3>${title}</h3><div class="status-word-list">${words.length ? words.map(w => `<span>${w.latin}</span>`).join('') : '<span>—</span>'}</div></section>`;
}

function startPracticeMode() {
  const groups = summarizeDiagnostics(state.diagnostics);
  const ids = [...groups[STATUS.NOT_MASTERED], ...groups[STATUS.UNSURE], ...groups[STATUS.UNTESTED]].map(w => w.id);
  if (!ids.length) {
    toast('Aktuell gibt es keine unsicheren Vokabeln.');
    return;
  }
  openPractice(ids, 0);
}

function openPractice(ids, index) {
  const id = ids[index % ids.length];
  const word = VOCAB_BY_ID[id];
  const stats = state.diagnostics[id];
  const direction = stats?.directions?.g2l?.unaidedCorrect > stats?.directions?.l2g?.unaidedCorrect ? 'l2g' : 'g2l';
  const prompt = direction === 'g2l' ? word.german[0] : word.latin;
  const label = direction === 'g2l' ? 'Lateinisches Wort' : 'Deutsche Bedeutung';
  const started = Date.now();
  openInspection('Gezielte Nachprüfung', `
    <div class="practice-card">
      <p class="eyebrow dark">${index + 1} von ${ids.length}</p>
      <h2>${escapeHtml(prompt)}</h2>
      <form data-practice-form>
        <label>${label}<input name="answer" autocomplete="off" autocapitalize="none" autofocus></label>
        <button class="primary-btn" type="submit">Prüfen</button>
      </form>
      <p class="practice-feedback" aria-live="polite"></p>
    </div>`, root => {
      root.querySelector('[data-practice-form]').addEventListener('submit', event => {
        event.preventDefault();
        const answer = new FormData(event.currentTarget).get('answer');
        const ok = isCorrectAnswer(id, direction, answer);
        recordAttempt(state.diagnostics, id, { direction, correct: ok, usedHint: false, responseMs: Date.now() - started });
        persist();
        const feedback = root.querySelector('.practice-feedback');
        if (ok) {
          feedback.textContent = 'Das Siegel bestätigt die Antwort.';
          playSound('success', state.soundEnabled);
          setTimeout(() => {
            closeInspection();
            if (index + 1 < ids.length) openPractice(ids, index + 1);
            else render();
          }, 500);
        } else {
          feedback.textContent = `Noch nicht. Gesucht: ${direction === 'g2l' ? word.latin : word.german[0]}.`;
          playSound('error', state.soundEnabled);
        }
      });
    });
}

function completedRoom(headline, body, buttonLabel, nextRoom) {
  return `<section class="scene transition-scene"><div class="transition-card"><div class="success-glyph" aria-hidden="true">⌁</div><h2>${escapeHtml(headline)}</h2><p>${escapeHtml(body)}</p><button class="primary-btn" data-next-room="${escapeHtml(nextRoom)}">${escapeHtml(buttonLabel)}</button></div></section>`;
}

function wireCompletedRoom(world) {
  world.querySelector('[data-next-room]')?.addEventListener('click', event => goToRoom(event.currentTarget.dataset.nextRoom));
}

function goToRoom(roomId) {
  const currentIndex = roomOrder.indexOf(state.currentRoom);
  const nextIndex = roomOrder.indexOf(roomId);
  state.currentRoom = roomId;
  state.selectedInventoryItem = null;
  persist();
  playSound('tap', state.soundEnabled);
  render();
  if (nextIndex > currentIndex && state.reviewQueue.length && !['results', 'prolog'].includes(roomId)) {
    window.setTimeout(() => maybeAdaptiveReview(), 350);
  }
}

function maybeAdaptiveReview() {
  if (adaptiveReviewInFlight || !state.reviewQueue.length) return;
  const wordId = state.reviewQueue.shift();
  const word = VOCAB_BY_ID[wordId];
  if (!word) return;
  adaptiveReviewInFlight = true;
  const stats = state.diagnostics[wordId];
  const direction = stats.directions.g2l.attempts <= stats.directions.l2g.attempts ? 'g2l' : 'l2g';
  const question = direction === 'g2l' ? `Die Wache verlangt das lateinische Kennwort für „${word.german[0]}“.` : `Die Wache zeigt „${word.latin.toUpperCase()}“. Nenne die deutsche Bedeutung.`;
  const started = Date.now();
  openInspection('Kontrollsiegel der Wache', `
    <div class="guard-review">
      <div class="guard-emblem" aria-hidden="true">VIG</div>
      <p>${escapeHtml(question)}</p>
      <form data-review-form class="inline-form vertical">
        <input name="answer" autocomplete="off" autocapitalize="none" aria-label="Antwort auf die Kontrollfrage" autofocus>
        <button class="primary-btn" type="submit">Siegel vorzeigen</button>
      </form>
      <button class="text-btn" data-review-help>Antwort als Hinweis zeigen und passieren</button>
      <p class="review-feedback" aria-live="polite"></p>
    </div>`, root => {
      const finish = () => { adaptiveReviewInFlight = false; persist(); closeInspection(); };
      root.querySelector('[data-review-form]').addEventListener('submit', event => {
        event.preventDefault();
        const answer = new FormData(event.currentTarget).get('answer');
        const ok = isCorrectAnswer(wordId, direction, answer);
        recordAttempt(state.diagnostics, wordId, { direction, correct: ok, usedHint: false, responseMs: Date.now() - started });
        if (ok) {
          root.querySelector('.review-feedback').textContent = 'Das Kontrollsiegel passt.';
          playSound('success', state.soundEnabled);
          setTimeout(finish, 450);
        } else {
          queueReview(state, wordId);
          root.querySelector('.review-feedback').textContent = 'Die Wache schüttelt den Kopf. Du kannst es erneut versuchen oder den Hinweis nutzen.';
          playSound('error', state.soundEnabled);
        }
      });
      root.querySelector('[data-review-help]').addEventListener('click', () => {
        const answer = direction === 'g2l' ? word.latin : word.german[0];
        root.querySelector('.review-feedback').textContent = `Hinweis: ${answer}. Die Wache lässt dich passieren; diagnostisch zählt das nicht als sicher.`;
        recordAttempt(state.diagnostics, wordId, { direction, correct: true, usedHint: true, responseMs: Date.now() - started });
        setTimeout(finish, 900);
      });
    }, { preventBackdropClose: true });
}

function showHint() {
  const puzzle = puzzleForRoom(state.currentRoom, state.solvedPuzzles);
  if (!puzzle) {
    toast('Für diesen Abschnitt ist gerade kein Hinweis nötig.');
    return;
  }
  const alreadyUsed = puzzleHintCount(puzzle.id);
  const revealedIndex = Math.min(alreadyUsed, puzzle.hints.length - 1);
  if (alreadyUsed < puzzle.hints.length) {
    state.hintsUsed[puzzle.id] = alreadyUsed + 1;
    markPuzzleHints(puzzle);
    persist();
  }
  const totalUsed = puzzleHintCount(puzzle.id);
  openInspection('Hinweissiegel', `
    <div class="hint-panel">
      <div class="hint-number">${Math.min(totalUsed, 3)}</div>
      <h2>Hinweis ${Math.min(totalUsed, 3)} von 3</h2>
      <p>${escapeHtml(puzzle.hints[revealedIndex])}</p>
      <div class="hint-actions">
        ${totalUsed >= 3 ? '<button class="danger-quiet" data-show-solution>Lösung zeigen</button>' : ''}
        <button class="secondary-btn" data-close>Zurück zum Rätsel</button>
      </div>
    </div>`, root => {
      root.querySelector('[data-show-solution]')?.addEventListener('click', () => applyPuzzleSolution(puzzle.id));
    });
}

function applyPuzzleSolution(puzzleId) {
  state.hintsUsed[puzzleId] = Math.max(3, state.hintsUsed[puzzleId] || 0);
  const assisted = id => recordAttempt(state.diagnostics, id, { direction: 'application', correct: true, usedHint: true, responseMs: 0 });
  switch (puzzleId) {
    case 'forumLock':
      state.puzzleData.forumLock = { step: 4, chosen: [7,9,3,2], startedAt: Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted);
      break;
    case 'archiveShelves':
      state.puzzleData.archiveShelves = { selected: null, matched: { Begleiter:'comes', Provinz:'provincia', Brauch:'mos', Gefäß:'vas' }, startedAt: Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted);
      break;
    case 'archiveSeals':
      state.puzzleData.archiveSeals = { firstDone: true, secondDone: true, startedAt: Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted);
      addInventory(state, 'cipherLens');
      break;
    case 'messengerOrder':
      state.puzzleData.messengerOrder = { order: ['parare','audere','agere','mittere'], startedAt: Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted);
      break;
    case 'messengerPassword':
      assisted('audere'); addInventory(state, 'courierToken');
      break;
    case 'suspect':
      PUZZLES[puzzleId].wordIds.forEach(assisted); addInventory(state, 'suspectSeal');
      break;
    case 'senateTable':
      state.puzzleData.senateTable = { step: 3, startedAt: Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted); addInventory(state, 'senateSeal');
      break;
    case 'finalCipher':
      state.puzzleData.finalCipher = { matches: Object.fromEntries(['alius','modus','varius','omnis','velut','sibi','ubi','grandis'].map(id => [id,id])), selected:null, startedAt:Date.now() };
      PUZZLES[puzzleId].wordIds.forEach(assisted);
      break;
  }
  solvePuzzle(state, puzzleId);
  persist();
  closeInspection();
  playSound('unlock', state.soundEnabled);
  toast('Der Lösungsweg wurde aufgedeckt. Der Spielfortschritt geht weiter; die Lernwertung bleibt als „mit Hilfe“ markiert.');
  render();
}

function showMenu() {
  openInspection('Menü', `
    <div class="menu-panel">
      <div class="menu-stat"><span>Ort</span><strong>${escapeHtml(ROOM_META[state.currentRoom].title)}</strong></div>
      <div class="menu-stat"><span>Spielzeit</span><strong>${formatTime(elapsedSeconds())}</strong></div>
      <label class="toggle-row"><span>Sound</span><input type="checkbox" data-sound ${state.soundEnabled ? 'checked' : ''}><span class="switch" aria-hidden="true"></span></label>
      <button class="secondary-btn" data-close>Weiterspielen</button>
      <button class="danger-quiet" data-restart>Neues Spiel starten</button>
    </div>`, root => {
      root.querySelector('[data-sound]').addEventListener('change', event => {
        state.soundEnabled = event.currentTarget.checked;
        persist();
        if (state.soundEnabled) playSound('tap', true);
      });
      root.querySelector('[data-restart]').addEventListener('click', () => {
        if (!window.confirm('Gespeicherten Fortschritt löschen und neu beginnen?')) return;
        closeInspection();
        startNewGame();
      });
    });
}

function openInspection(title, content, setup, options = {}) {
  if (inspectionCleanup) inspectionCleanup();
  const root = app.querySelector('#inspection-root');
  if (!root) return;
  root.innerHTML = `
    <div class="inspection-overlay" role="dialog" aria-modal="true" aria-labelledby="inspection-title">
      <div class="inspection-backdrop" data-backdrop></div>
      <section class="inspection-card">
        <header><h1 id="inspection-title">${escapeHtml(title)}</h1><button class="close-btn" data-close aria-label="Schließen">×</button></header>
        <div class="inspection-content">${content}</div>
      </section>
    </div>`;
  const overlay = root.querySelector('.inspection-overlay');
  const closeButtons = root.querySelectorAll('[data-close]');
  closeButtons.forEach(btn => btn.addEventListener('click', closeInspection));
  if (!options.preventBackdropClose) root.querySelector('[data-backdrop]')?.addEventListener('click', closeInspection);
  const keyHandler = event => {
    if (event.key === 'Escape' && !options.preventBackdropClose) closeInspection();
  };
  document.addEventListener('keydown', keyHandler);
  inspectionCleanup = () => document.removeEventListener('keydown', keyHandler);
  setup?.(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  const focusable = root.querySelector('input, button:not([disabled])');
  focusable?.focus({ preventScroll: true });
}

function closeInspection() {
  const root = app.querySelector('#inspection-root');
  if (inspectionCleanup) inspectionCleanup();
  inspectionCleanup = null;
  if (root) root.innerHTML = '';
}

function toast(message) {
  const root = app.querySelector('#toast-root');
  if (!root) return;
  root.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
  window.setTimeout(() => { if (root) root.innerHTML = ''; }, 2400);
}

window.addEventListener('beforeunload', commitClock);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) commitClock();
  else resetSessionClock();
});
window.setInterval(() => { if (state.started && !state.completed) persist(); }, 15000);

render();

})();
</script>

</html>
