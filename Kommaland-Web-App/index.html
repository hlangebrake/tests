<!doctype html>
<html lang="de">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
 <meta name="theme-color" content="#365b4f">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="Kommaland">
 <meta name="description" content="Ein kleines 3D-Abenteuer durch die Welt der Dezimalzahlen. Lernen, entdecken und gemeinsam Kommaland zum Leuchten bringen.">
 <link rel="manifest" href="./manifest.webmanifest">
 <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
 <link rel="apple-touch-icon" href="./icons/icon-192.png">
 <link rel="stylesheet" href="./styles.css">
 <title>Kommaland · Dein Dezimalzahlen-Abenteuer</title>
</head>
<body>
 <main id="app">
  <div id="gameShell">
   <canvas id="world" aria-label="Kommaland: dreidimensionale Lernwelt. Bewegen mit den Pfeiltasten, WASD oder dem Steuerkreis. E öffnet ein nahes Objekt." tabindex="0"></canvas>
   <div class="vignette" aria-hidden="true"></div>
   <div id="worldLabels" aria-label="Objekte in der Nähe"></div>
   <header id="hud">
    <div class="brand"><span class="brand-mark" id="brandIcon"></span><div><strong>KOMMALAND</strong><span>Kleine Zahlen. Große Abenteuer.</span></div></div>
    <div class="place-pill"><span id="placeIcon"></span><div><strong id="placeName">Funkeldorf</strong><span id="placeTopic">Dezimalzahlen verstehen</span></div></div>
    <nav class="hud-actions" aria-label="Spielmenü">
     <span class="progress-pill" title="Abgeschlossene Quests"><span class="sparkle">✦</span><b id="questCount">0</b><span>/ <span id="questTotal">45</span></span></span>
     <button id="mapButton" class="icon-button" aria-label="Lernlandkarte öffnen" title="Lernlandkarte (M)"></button>
     <button id="menuButton" class="icon-button" aria-label="Rucksack und Einstellungen öffnen" title="Rucksack"></button>
    </nav>
   </header>
   <button id="tracker" aria-label="Nächste Quest anzeigen"><span class="eyebrow">DEIN NÄCHSTER SCHRITT</span><span class="tracker-main"><span id="trackerIcon"></span><span><strong id="trackerTitle">Eine Laterne in der Mitte</strong><small id="trackerDetail">Funkeldorf · 0 von 3 Schritten</small></span><span class="tracker-arrow">›</span></span><span class="tiny-progress"><i id="trackerFill"></i></span></button>
   <div id="arrival" aria-live="polite"><span id="arrivalTag"></span><strong id="arrivalName"></strong></div>
   <div id="joystick" role="group" aria-label="Touch-Steuerkreis: ziehen zum Laufen">
    <div class="joystick-arrows" aria-hidden="true"><span>⌃</span><span>›</span><span>⌄</span><span>‹</span></div><div id="stickKnob"></div>
   </div>
   <span class="joystick-label">ZIEHEN ZUM LAUFEN</span>
   <div id="bottomHint">Tippe auf den Boden, um loszulaufen.</div>
   <div class="interact-wrap"><small id="interactHint">Geh zu einem Schild oder einer Quest.</small><button id="interactButton" disabled><span id="interactIcon"></span><span id="interactText">Entdecken</span><kbd>E</kbd></button></div>
   <div class="save-dot" id="saveDot" title="Automatisch lokal gespeichert"><i></i><span id="saveLabel">Lokal gespeichert</span></div>
  </div>
  <div id="overlay" hidden><section id="panel" class="scroll-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"></section></div>
  <div id="buildNotice" class="build-notice" role="status" aria-live="polite" hidden><span class="build-spark">✦</span><div><strong id="buildName"></strong><span id="buildStage"></span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading"><div class="loading-symbol">✦</div><strong>Kommaland erwacht …</strong><span>Ein Abenteuer aus kleinen Zahlen.</span></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
 </main>
 <noscript><div class="fatal-static">Für Kommaland muss JavaScript aktiviert sein.</div></noscript>
 <script type="module">
  import('./js/app.js').catch(error => {
   const el = document.getElementById('loading');
   el.replaceChildren();
   const h = document.createElement('strong'); h.textContent = 'Kommaland konnte nicht starten.';
   const p = document.createElement('p'); p.textContent = location.protocol === 'file:' ? 'Bitte öffne die App über einen Webserver, nicht direkt aus der Dateien-App. Hinweise stehen in README.md.' : error.message;
   const b = document.createElement('button'); b.textContent = 'Erneut versuchen'; b.onclick = () => location.reload();
   el.append(h,p,b); console.error(error);
  });
 </script>
</body>
</html>
