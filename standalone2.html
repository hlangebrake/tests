<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161310"><meta name="color-scheme" content="dark">
<title>Die Verschwörung im Senat · V2</title>
<style>:root {
  --ink: #1d1915;
  --paper: #e8d5ae;
  --paper-light: #f4e6c7;
  --bronze: #a77a3e;
  --bronze-light: #d6ad6c;
  --bronze-dark: #5f4022;
  --stone: #413d36;
  --stone-dark: #171512;
  --wine: #6f2e2e;
  --wine-deep: #3c1718;
  --cream: #f6ecd5;
  --muted: #b7ad9a;
  --safe: #7f9b78;
  --danger: #9a5b52;
  --shadow: 0 18px 55px rgba(0,0,0,.38);
  --display: Georgia, 'Times New Roman', serif;
  --body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: clamp(15px, 1.25vw, 18px);
}

* { box-sizing: border-box; }
html, body, #app { margin: 0; min-height: 100%; width: 100%; }
body {
  min-height: 100dvh;
  overflow-x: hidden;
  font-family: var(--body);
  color: var(--cream);
  background: #141210;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; }
button { touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid #f2cf87; outline-offset: 3px; }
button:disabled { opacity: .4; cursor: not-allowed; }

.primary-btn, .secondary-btn, .danger-quiet, .text-btn {
  min-height: 48px;
  border-radius: 8px;
  padding: .72rem 1.15rem;
  border: 1px solid transparent;
  font-weight: 750;
  cursor: pointer;
}
.primary-btn {
  color: #17110a;
  background: linear-gradient(#e0b974, #ad7b3e);
  border-color: #edcf94;
  box-shadow: inset 0 1px rgba(255,255,255,.35), 0 7px 18px rgba(0,0,0,.28);
}
.secondary-btn { color: var(--cream); background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.25); }
.danger-quiet { color: #ffd7ce; background: rgba(116,42,39,.22); border-color: rgba(209,122,104,.45); }
.text-btn { color: #7a4f24; background: transparent; text-decoration: underline; text-underline-offset: 4px; }

.eyebrow { margin: 0 0 .55rem; text-transform: uppercase; letter-spacing: .19em; font-weight: 800; font-size: .72rem; color: #d5b475; }
.eyebrow.dark { color: #744c25; }

/* Landing */
.landing-shell {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  position: relative;
  padding: 4vw;
  overflow: hidden;
  background:
    radial-gradient(circle at 72% 26%, rgba(182,107,47,.26), transparent 30%),
    linear-gradient(115deg, rgba(7,7,6,.25), rgba(0,0,0,.76)),
    repeating-linear-gradient(92deg, #38342e 0 3px, #312e29 3px 8px, #35312b 8px 15px);
}
.landing-vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 16vw rgba(0,0,0,.86); }
.landing-card {
  width: min(760px, 92vw);
  padding: clamp(2rem, 5vw, 4.2rem);
  text-align: center;
  position: relative;
  border: 1px solid rgba(224,185,116,.42);
  background: linear-gradient(rgba(26,21,17,.92), rgba(18,15,13,.94));
  box-shadow: var(--shadow);
}
.landing-card::before, .landing-card::after { content: ''; position: absolute; width: 46px; height: 46px; border-color: var(--bronze); opacity: .6; }
.landing-card::before { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
.landing-card::after { right: 12px; bottom: 12px; border-right: 2px solid; border-bottom: 2px solid; }
.spqr-mark { width: 74px; height: 74px; margin: 0 auto 1.1rem; display: grid; place-items: center; border: 2px solid #b98849; border-radius: 50%; color: #ddb975; font: 700 .88rem var(--display); letter-spacing: .06em; box-shadow: inset 0 0 0 7px rgba(185,136,73,.1); }
.landing-card h1 { margin: 0; font: 700 clamp(2.5rem, 6vw, 5.1rem)/.93 var(--display); letter-spacing: -.04em; }
.landing-card h1 span { color: #d1a566; }
.landing-copy { max-width: 610px; margin: 1.45rem auto 1.8rem; color: #d8d0c0; line-height: 1.6; }
.landing-actions { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; }
.landing-actions button { min-width: 190px; }
.landing-note { margin: 1.25rem 0 0; font-size: .78rem; color: #8e877b; }

/* App shell */
.game-shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; background: var(--stone-dark); }
.topbar {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: max(.7rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .7rem max(1rem, env(safe-area-inset-left));
  background: linear-gradient(#201d19, #151311);
  border-bottom: 1px solid rgba(212,172,105,.22);
  z-index: 5;
}
.objective-wrap { min-width: 0; display: grid; gap: .2rem; }
.location-label { color: #d7b374; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 800; }
.objective { font-size: .94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: .45rem; }
.icon-btn {
  min-width: 62px; min-height: 50px; color: #eee1c8; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; cursor: pointer; display: grid; place-items: center; grid-template-columns: auto; padding: .25rem .6rem;
}
.icon-btn > span:first-child { font-weight: 900; font-size: 1.15rem; line-height: 1; }
.icon-label { font-size: .64rem; color: #bdb3a2; }
.menu-lines { width: 22px; height: 14px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; position: relative; }
.menu-lines::after { content:''; position:absolute; left:0; right:0; top:5px; border-top:2px solid currentColor; }

.world { min-height: 0; position: relative; overflow: hidden; background: #24211c; }
.scene { min-height: 100%; height: 100%; position: relative; padding: clamp(1.2rem, 2.7vw, 2.6rem); overflow: auto; }
.inventory-bar {
  min-height: 92px;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .65rem max(1rem, env(safe-area-inset-right)) max(.65rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  background: linear-gradient(#171411, #0f0e0d);
  border-top: 1px solid rgba(212,172,105,.28);
  z-index: 4;
}
.inventory-title { flex: 0 0 auto; text-transform: uppercase; letter-spacing: .17em; font-size: .68rem; color: #a98c5d; font-weight: 850; }
.inventory-items { display: flex; gap: .55rem; overflow-x: auto; padding: .18rem .1rem; scrollbar-width: thin; }
.inventory-item { min-height: 58px; min-width: 150px; max-width: 205px; padding: .45rem .65rem; display: grid; grid-template-columns: 34px 1fr; gap: .5rem; align-items: center; color: #e6dbc6; background: #28231d; border: 1px solid #554734; border-radius: 8px; text-align: left; cursor: pointer; font-size: .73rem; }
.inventory-item.selected { border-color: #d6aa67; box-shadow: inset 0 0 0 1px #d6aa67; }
.inventory-symbol { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #2b1d0f; background: #b98a4e; font: 800 .72rem var(--display); }
.inventory-empty { color: #706b62; font-size: .8rem; }

/* Generic scenes */
.prolog-scene { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(230px, .55fr); gap: 3vw; align-items: center; background: radial-gradient(circle at 35% 40%, rgba(177,105,48,.18), transparent 33%), linear-gradient(110deg,#302a23,#151310); }
.intercept-table { color: #281e14; width: min(680px, 100%); justify-self: center; padding: clamp(1.7rem,4vw,3.4rem); background: linear-gradient(96deg,#e8d3a9,#d7bd8e); box-shadow: 0 18px 55px #0009, inset 0 0 45px #8e61222b; transform: rotate(-.5deg); position: relative; }
.intercept-table::after { content:''; position:absolute; inset:10px; border:1px solid rgba(101,65,31,.27); pointer-events:none; }
.intercept-table h2 { font: 700 clamp(1.55rem,3vw,2.7rem)/1.16 var(--display); margin: 0 0 1rem; }
.intercept-table p { line-height: 1.55; }
.seal-mark { position:absolute; right:8%; top:10%; width:68px; height:68px; border-radius:50%; display:grid; place-items:center; background:#7e2c2d; color:#e8c6a0; font:700 1.8rem var(--display); box-shadow:0 4px 9px #0007, inset 0 0 0 5px #4e1b1b55; }
.story-aside { align-self: end; padding: 1.2rem; border-left: 3px solid #b08449; background: rgba(0,0,0,.28); display:grid; gap:.5rem; color:#d5c9b6; line-height:1.5; }
.story-aside strong { color:#d6ad6c; text-transform:uppercase; letter-spacing:.13em; font-size:.74rem; }

.forum-scene { display:grid; place-items:center; background: radial-gradient(circle at 50% 0%, rgba(204,152,79,.16), transparent 40%), linear-gradient(#625e56 0 18%, #34312b 18% 100%); }
.forum-columns::before, .forum-columns::after { content:''; position:absolute; top:8%; bottom:0; width:12%; background:repeating-linear-gradient(90deg,#777269 0 12px,#625e56 12px 18px); opacity:.38; }
.forum-columns::before { left:3%; } .forum-columns::after { right:3%; }
.gate-panel { width:min(820px,88vw); padding:clamp(1.25rem,3vw,2.2rem); text-align:center; background:linear-gradient(#2b2925,#1b1916); border:1px solid #75634b; box-shadow:0 18px 70px #000a, inset 0 0 0 7px #0003; position:relative; z-index:1; }
.gate-heading { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; border-bottom:1px solid #715b3c; padding-bottom:.8rem; margin-bottom:1rem; }
.gate-heading span { font:700 1.45rem var(--display); letter-spacing:.09em; color:#d3b174; }
.gate-heading small { color:#8d8476; }
.stone-clue strong { display:block; font:800 clamp(1.6rem,3vw,2.5rem) var(--display); margin:.3rem 0 .8rem; }
.stone-clue > span { color:#9e9282; font-size:.75rem; text-transform:uppercase; letter-spacing:.15em; }
.code-track { display:flex; justify-content:center; gap:.5rem; margin-bottom:1.2rem; }
.code-slot { width:48px; height:48px; display:grid; place-items:center; border:1px solid #6a5942; background:#15130f; font:700 1.15rem ui-monospace, monospace; color:#dfba7c; }
.plaque-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; }
.latin-plaque { min-height:110px; border:1px solid #746957; color:#eee4d2; background:linear-gradient(#524e46,#393630); display:grid; place-items:center; align-content:center; gap:.3rem; cursor:pointer; box-shadow:inset 0 0 25px #0003; }
.latin-plaque span { font:700 1rem var(--display); letter-spacing:.08em; }
.latin-plaque strong { color:#d7b273; font-size:1.7rem; }
.scene-instruction { margin:1rem 0 0; color:#aea392; font-size:.8rem; }
.inspect-hotspot { position:absolute; bottom:7%; right:8%; min-width:150px; min-height:48px; color:#26190d; background:#d9bf8b; border:1px solid #f2d8a3; transform:rotate(1deg); box-shadow:0 7px 19px #0008; cursor:pointer; font-weight:750; }
.shake { animation:shake .28s linear; }

.archive-scene { display:grid; place-items:center; background: linear-gradient(rgba(13,12,10,.35),rgba(13,12,10,.72)), repeating-linear-gradient(90deg,#44372a 0 5px,#3b3026 5px 60px,#322920 60px 65px); }
.archive-workbench, .wax-tablet-panel { width:min(900px,92vw); padding:clamp(1.2rem,2.5vw,2rem); background:rgba(20,17,13,.9); border:1px solid #6d5637; box-shadow:var(--shadow); }
.archive-workbench h2, .wax-tablet-panel h2 { font:700 clamp(1.7rem,3vw,2.6rem) var(--display); margin:.2rem 0 .4rem; }
.loose-tags { min-height:70px; display:flex; gap:.7rem; flex-wrap:wrap; padding:1rem 0; }
.paper-tag { min-width:120px; min-height:52px; padding:.6rem 1rem; color:#352719; background:#dcc59a; border:1px solid #f0dcaf; box-shadow:0 5px 14px #0005; cursor:pointer; transform:rotate(-1deg); }
.paper-tag:nth-child(even) { transform:rotate(1.3deg); }
.paper-tag.selected { outline:3px solid #d3a85f; outline-offset:2px; }
.shelf-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.65rem; }
.archive-shelf { min-height:80px; padding:1rem; text-align:left; color:#e7dcc8; background:linear-gradient(#2e261d,#201a15); border:1px solid #65513b; cursor:pointer; display:flex; align-items:center; justify-content:space-between; }
.archive-shelf span { font:700 1.05rem var(--display); letter-spacing:.08em; }
.archive-shelf small { color:#887d6c; }
.archive-shelf.filled { opacity:.52; }
.wax-tablet-panel { color:#2f2418; background:linear-gradient(#dfc692,#c9aa72); border:8px solid #6e4c2d; box-shadow:var(--shadow), inset 0 0 45px #6c461b33; }
.seal-form { display:grid; gap:1rem; margin-top:1.2rem; }
.wax-input { display:grid; grid-template-columns:minmax(180px,.65fr) 1fr; gap:1rem; align-items:center; }
.wax-input span { font-weight:850; letter-spacing:.08em; }
.wax-input input, .inline-form input, .practice-card input, .guard-review input { width:100%; min-height:52px; border:1px solid #745738; border-radius:5px; padding:.7rem .85rem; color:#271b10; background:#f2e4c7; }
.wax-input.solved input { color:#27472f; background:#d8ddbf; }

.messenger-scene { display:grid; place-items:center; background:radial-gradient(circle at 25% 28%,rgba(218,159,80,.14),transparent 24%), linear-gradient(130deg,#30271f,#171411); }
.dispatch-board { width:min(880px,92vw); padding:clamp(1.2rem,3vw,2.4rem); background:linear-gradient(#c8aa78,#a98555); color:#25190f; border:10px solid #593b24; box-shadow:var(--shadow), inset 0 0 50px #5f391833; }
.dispatch-copy h2 { margin:.2rem 0 .5rem; font:700 clamp(1.4rem,3vw,2.3rem) var(--display); }
.order-slots { display:grid; grid-template-columns:repeat(4,1fr); gap:.65rem; margin:1.3rem 0 .9rem; }
.order-slot { min-height:64px; border:2px dashed #6a4c30; background:rgba(247,227,189,.35); color:#342215; font-weight:800; cursor:pointer; }
.verb-cards { display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; }
.verb-card { min-width:130px; min-height:56px; color:#ead8b8; background:#4b3020; border:1px solid #826043; box-shadow:0 4px 10px #0005; cursor:pointer; font-family:var(--display); letter-spacing:.06em; }
.courier-lock { width:min(850px,92vw); display:grid; grid-template-columns:minmax(220px,.75fr) 1.25fr; gap:2rem; align-items:center; padding:clamp(1.5rem,4vw,3rem); background:#1e1a16; border:1px solid #765737; box-shadow:var(--shadow); }
.courier-lock h2 { font:700 clamp(1.6rem,3.2vw,2.6rem) var(--display); margin:.2rem 0 .5rem; }
.bronze-dial { aspect-ratio:1; max-width:280px; margin:auto; border-radius:50%; border:18px solid #6a4828; box-shadow:inset 0 0 0 5px #b6884f, inset 0 0 40px #0007, 0 10px 35px #0008; display:flex; align-items:center; justify-content:space-around; color:#e4c384; background:radial-gradient(circle,#51361f,#241a12); font-family:var(--display); }
.inline-form { display:flex; gap:.6rem; align-items:center; }
.inline-form.vertical { flex-direction:column; align-items:stretch; }

.files-scene { background:linear-gradient(rgba(20,17,13,.55),rgba(20,17,13,.8)), repeating-linear-gradient(0deg,#4b3929 0 4px,#3a2c21 4px 45px); }
.informant-strip { width:min(960px,95vw); margin:0 auto 1.3rem; padding:1rem 1.2rem; display:flex; gap:1rem; align-items:center; color:#302216; background:#e1cda5; border-left:5px solid #7b2e2e; box-shadow:0 8px 25px #0007; }
.informant-strip strong { flex:0 0 auto; text-transform:uppercase; letter-spacing:.1em; font-size:.75rem; }
.dossier-grid { width:min(1050px,96vw); margin:auto; display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; }
.dossier { min-width:0; display:grid; gap:.5rem; }
.dossier-open { min-height:300px; position:relative; padding:1rem; color:#332316; background:linear-gradient(98deg,#d4b989,#bc9560); border:1px solid #ead0a0; box-shadow:0 14px 30px #0007; cursor:pointer; text-align:left; overflow:hidden; }
.dossier-tab { display:block; font-size:.62rem; letter-spacing:.11em; font-weight:800; color:#6c4122; }
.portrait-silhouette, .portrait-large { display:block; width:80px; height:100px; margin:2rem auto 1.2rem; border-radius:50% 50% 42% 42%; background:radial-gradient(circle at 50% 28%,#5a4939 0 24%,transparent 25%), linear-gradient(90deg,transparent 20%,#5a4939 20% 80%,transparent 80%); opacity:.75; }
.dossier-open strong { display:block; font:700 1.5rem var(--display); text-align:center; }
.dossier-open small { display:block; text-align:center; margin-top:.3rem; color:#6d563e; }
.mark-suspect { min-height:48px; color:#e9d7b8; background:#251c16; border:1px solid #705438; cursor:pointer; }
.dossier-inspection { color:#2d2015; max-width:780px; margin:auto; padding:1.2rem; background:#e1c89b; }
.portrait-large { width:120px; height:150px; }
.trait-list { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; padding:1rem; background:#c7aa78; }
.trait-list span { color:#6e4c2e; font-size:.75rem; letter-spacing:.12em; }
.trait-list strong { font-family:var(--display); }

.senate-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 12%,rgba(226,182,109,.18),transparent 35%), linear-gradient(#4b4944 0 25%,#26231f 25% 100%); }
.senate-depth { position:absolute; left:7%; right:7%; top:4%; height:30%; border-radius:50% 50% 0 0; border:2px solid #706d65; opacity:.35; }
.senate-mechanism { width:min(920px,92vw); padding:clamp(1.5rem,3vw,2.6rem); text-align:center; position:relative; z-index:1; background:linear-gradient(#251f19,#171310); border:1px solid #796042; box-shadow:var(--shadow); }
.senate-mechanism h2 { font:700 clamp(1.5rem,3.2vw,2.5rem) var(--display); }
.lever-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin:1.4rem 0; }
.bronze-lever { min-height:160px; padding:1rem; color:#eddcbd; background:linear-gradient(#493421,#291d13); border:1px solid #8c6841; cursor:pointer; display:grid; place-items:center; gap:.8rem; }
.lever-handle { display:block; width:32px; height:72px; border-radius:16px; background:linear-gradient(90deg,#5d3b1f,#c09152,#644123); box-shadow:0 8px 14px #0007; transform:rotate(-7deg); transform-origin:bottom; }
.bronze-lever strong { font:700 .92rem var(--display); letter-spacing:.06em; }
.mechanism-progress { display:flex; justify-content:center; gap:.7rem; }
.mechanism-light { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#3f3327; border:1px solid #71583b; color:#786a58; }
.mechanism-light.on { color:#2d2112; background:#d0a35d; box-shadow:0 0 18px #c69348aa; }

.final-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 20%,rgba(162,88,44,.2),transparent 30%), linear-gradient(130deg,#261b16,#0e0c0a); }
.cipher-desk, .final-document { width:min(1000px,94vw); padding:clamp(1.3rem,3vw,2.5rem); color:#2b2016; background:linear-gradient(96deg,#ead9b6,#cfb181); box-shadow:0 18px 60px #000b, inset 0 0 65px #8f5b2633; }
.cipher-desk h2, .final-document h2 { margin:.2rem 0 1rem; font:700 clamp(1.5rem,3vw,2.5rem) var(--display); }
.cipher-layout { display:grid; grid-template-columns:1.3fr .7fr; gap:1rem; }
.meaning-list { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; }
.meaning-slot { min-height:72px; padding:.7rem 1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; color:#3a2a1c; background:rgba(255,255,255,.25); border:1px dashed #866342; cursor:pointer; text-align:left; }
.meaning-slot strong { font-family:var(--display); color:#793f2f; }
.meaning-slot.filled { background:#d7d7b5; border-style:solid; }
.word-bank { align-content:start; display:flex; flex-wrap:wrap; gap:.55rem; }
.wax-chip { min-width:105px; min-height:52px; padding:.5rem .8rem; border-radius:22px; color:#f1d0ad; background:#713133; border:2px solid #4b1e20; box-shadow:inset 0 0 0 4px #8d464766, 0 5px 12px #0005; cursor:pointer; font-family:var(--display); }
.wax-chip.selected { outline:4px solid #7a5228; outline-offset:3px; }
.solved-final .final-document { max-width:760px; }

.transition-scene { display:grid; place-items:center; background:radial-gradient(circle at 50% 40%,rgba(177,124,67,.18),transparent 32%),linear-gradient(#2f2a23,#151310); }
.transition-card { width:min(620px,90vw); text-align:center; padding:2.5rem; border:1px solid #6d583d; background:rgba(22,18,14,.9); box-shadow:var(--shadow); }
.transition-card h2 { font:700 2rem var(--display); margin:.3rem 0 .6rem; }
.transition-card p { color:#c2b7a5; line-height:1.55; }
.success-glyph { width:65px; height:65px; margin:auto; border-radius:50%; display:grid; place-items:center; color:#24190f; background:#c39451; font-size:2rem; }

/* Results */
.results-scene { min-height:100%; overflow:auto; padding:clamp(1.2rem,3vw,2.6rem); background:linear-gradient(#201914,#100f0d); }
.mission-banner { width:min(1050px,96vw); margin:0 auto 1.1rem; padding:1.8rem 2rem; border:1px solid #6e5636; background:radial-gradient(circle at 90% 50%,rgba(164,99,44,.2),transparent 30%),#211b16; }
.mission-banner h1 { margin:.1rem 0 .3rem; font:700 clamp(2rem,4vw,3.5rem) var(--display); color:#e2c08a; }
.mission-banner p:last-child { color:#d1c7b7; }
.analysis-panel { width:min(1050px,96vw); margin:auto; }
.analysis-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; margin-bottom:1rem; }

const VOCAB_BY_ID = Object.fromEntries(VOCABULARY.map(v => [v.id, v]));

function normalizeAnswer(value = '') {
  return String(value ?? '')
    .toLocaleLowerCase('de-DE')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/ß/g, 'ss')
    .replace(/[.,;:!?()[\]{}]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function isCorrectAnswer(wordId, direction, answer) {
  const word = VOCAB_BY_ID[wordId];
  if (!word) return false;
  const normalized = normalizeAnswer(answer);
  const accepted = direction === 'g2l' ? word.forms : word.german;
  return accepted.some(v => normalizeAnswer(v) === normalized);
}


// src/diagnostics.js

const STATUS = { SAFE: 'SICHER', UNSURE: 'UNSICHER', NOT_MASTERED: 'NICHT BEHERRSCHT', UNTESTED: 'NOCH NICHT GEPRÜFT' };
const METHOD_WEIGHTS = { active: 3, application: 2, recognition: 1 };
const tally = () => ({ attempts: 0, correct: 0, incorrect: 0, unaidedCorrect: 0, unresolved: 0, totalResponseMs: 0 });

function blankWordStats() {
  return { encounters: 0, correct: 0, incorrect: 0, unresolved: 0, unaidedCorrect: 0, hints: 0, exposures: 0,
    totalResponseMs: 0, timedErrors: 0, timedUnresolved: 0, weightedEvidence: 0, lastSeenAt: null,
    directions: { l2g: tally(), g2l: tally() }, methods: { active: tally(), recognition: tally(), application: tally() },
    events: [], status: STATUS.UNTESTED };
}
function createDiagnostics() { return Object.fromEntries(VOCABULARY.map(v => [v.id, blankWordStats()])); }

// A selected answer is never silently promoted to free recall. Immediate corrections
// and repetitions of the same item cannot manufacture independent mastery evidence.
function calculateStatus(stats) {
  const attempts = (stats?.events || []).filter(e => e.outcome !== 'exposure');
  if (!attempts.length) return STATUS.UNTESTED;
  const independent = attempts.filter(e => e.outcome === 'correct' && !e.usedHint && !e.retry);
  const unique = [...new Map(independent.map(e => [`${e.context}:${e.item}:${e.direction}`, e])).values()];
  const active = unique.filter(e => e.method === 'active');
  const bothActive = ['l2g', 'g2l'].every(d => active.some(e => e.direction === d));
  const hasTransfer = unique.some(e => e.method === 'application');
  const contexts = new Set(active.map(e => e.context));
  let lastError = -1;
  attempts.forEach((e,i) => { if (e.outcome === 'incorrect' || e.outcome === 'unresolved') lastError=i; });
  const recovered = lastError < 0 || new Set(attempts.slice(lastError + 1)
    .filter(e => e.outcome === 'correct' && !e.usedHint && !e.retry).map(e => e.context)).size >= 2;
  if (bothActive && hasTransfer && contexts.size >= 2 && recovered) return STATUS.SAFE;
  const recent = attempts.filter(e => e.outcome !== 'unresolved').slice(-5);
  if (recent.filter(e => e.outcome === 'incorrect').length >= 2 && recent.filter(e => e.outcome === 'correct' && !e.usedHint).length < 2) return STATUS.NOT_MASTERED;
  return STATUS.UNSURE;
}

function recordAttempt(diagnostics, wordId, options = {}) {
  if (!VOCABULARY.some(v => v.id === wordId)) return null;
  const s = diagnostics[wordId] || blankWordStats();
  const direction = options.direction === 'g2l' ? 'g2l' : 'l2g';
  const method = ['active','recognition','application'].includes(options.method) ? options.method : 'application';
  const outcome = options.outcome || (options.correct === null ? 'unresolved' : options.correct ? 'correct' : 'incorrect');
  const responseMs = Math.max(0, Math.min(3600000, Math.round(Number(options.responseMs) || 0)));
  const context = options.context || 'unknown';
  const item = options.item || wordId;
  const already = s.events.some(e => e.context === context && e.item === item && e.outcome !== 'exposure');
  const e = { context, item, direction, method, outcome, responseMs,
    usedHint: !!options.usedHint, hintLevel: options.hintLevel || 0,
    retry: !!options.retry || already, timed: !!options.timed, pooled: !!options.pooled,
    reason: options.reason || '', at: new Date().toISOString() };
  s.events.push(e);
  s.lastSeenAt = e.at;
  if (outcome === 'exposure') { s.exposures++; }
  else {
    s.encounters++;
    s.totalResponseMs += responseMs;
    const buckets = [s, s.directions[direction], s.methods[method]];
    for (const b of buckets) {
      if (b !== s) { b.attempts++; b.totalResponseMs += responseMs; }
      if (outcome === 'correct') { b.correct++; if (!e.usedHint) b.unaidedCorrect++; }
      if (outcome === 'incorrect') b.incorrect++;
      if (outcome === 'unresolved') b.unresolved++;
    }
    if (outcome === 'incorrect' && e.timed) s.timedErrors++;
    if (outcome === 'unresolved' && e.timed) s.timedUnresolved++;
    if (outcome === 'correct' && !e.usedHint && !e.retry) s.weightedEvidence += METHOD_WEIGHTS[method];

}
function markHint(diagnostics, wordIds = []) {
  for (const id of new Set(wordIds)) if (diagnostics[id]) diagnostics[id].hints++;
}
function summarizeDiagnostics(diagnostics) {
  const groups = Object.fromEntries(Object.values(STATUS).map(v => [v, []]));
  for (const word of VOCABULARY) {
    const stats = diagnostics[word.id] || blankWordStats();
    stats.status = calculateStatus(stats);
    groups[stats.status].push({ ...word, stats });
  }

}
function needsReview(s) { return calculateStatus(s) !== STATUS.SAFE; }


// src/state.js

const ROOM_ORDER = ['prolog','forum','archive','messengers','files','senate','final','results'];
const ROOM_PUZZLES = { forum: 'forumPass', archive: 'archiveRegister', messengers: 'courierOrder', files: 'dossierInquiry', senate: 'senateSignal', final: 'finalDispatch' };
function createInitialState() {
  return { version: 2, started: false, completed: false, currentRoom: 'prolog', solvedPuzzles: [], inventory: [],
    puzzleData: {}, hintsUsed: {}, reviewQueue: [], diagnostics: createDiagnostics(),
    startedAt: null, accumulatedSeconds: 0, soundEnabled: true, timePressure: true,

}

// src/persistence.js



const STORAGE_KEY = 'roman-escape-state-v2';
const LEGACY_KEY = 'roman-escape-state-v1';
let storageNotice = '';
const object = v => !!v && typeof v === 'object' && !Array.isArray(v);
const safeNumber = v => Number.isFinite(v) && v >= 0 ? v : 0;

const itemIds = ['interceptedNote','cipherLens','courierToken','suspectSeal','senateSeal'];

function migrateV1(old) {
  const s = createInitialState();
  s.started = !!old.started;
  s.completed = !!old.completed;
  s.currentRoom = s.completed ? 'results' : ROOM_ORDER.includes(old.currentRoom) ? old.currentRoom : 'prolog';
  s.accumulatedSeconds = safeNumber(old.accumulatedSeconds);
  s.startedAt = old.startedAt || null;
  s.soundEnabled = old.soundEnabled !== false;
  s.inventory = Array.isArray(old.inventory) ? [...new Set(old.inventory.filter(v => itemIds.includes(v)))] : [];
  const oldSolved = Array.isArray(old.solvedPuzzles) ? old.solvedPuzzles : [];
  for (const [room, ids] of Object.entries(oldPuzzles)) {
    if (ids.every(id => oldSolved.includes(id)) || ROOM_ORDER.indexOf(room) < ROOM_ORDER.indexOf(s.currentRoom)) s.solvedPuzzles.push(ROOM_PUZZLES[room]);
  }

  s.migrationNotice = 'V1 übernommen: abgeschlossene Räume und Inventar bleiben erhalten. Ein begonnenes Rätsel startet als V2 neu. Alte Lernwerte stehen separat in der Historie.';

function validateState(raw) {

  const s = { ...base, ...raw };
  s.version = 2;
  s.started = !!raw.started;
  s.completed = !!raw.completed;
  s.currentRoom = s.completed ? 'results' : ROOM_ORDER.includes(raw.currentRoom) ? raw.currentRoom : 'prolog';
  s.solvedPuzzles = Array.isArray(raw.solvedPuzzles) ? [...new Set(raw.solvedPuzzles.filter(v => Object.values(ROOM_PUZZLES).includes(v)))] : [];
  s.inventory = Array.isArray(raw.inventory) ? [...new Set(raw.inventory.filter(v => itemIds.includes(v)))] : [];
  s.puzzleData = object(raw.puzzleData) ? raw.puzzleData : {};
  for (const [key, val] of Object.entries(s.puzzleData)) if (!object(val) || !Object.values(ROOM_PUZZLES).includes(key)) delete s.puzzleData[key];
  s.hintsUsed = object(raw.hintsUsed) ? Object.fromEntries(Object.entries(raw.hintsUsed).filter(([key]) => Object.values(ROOM_PUZZLES).includes(key)).map(([key,v]) => [key, Math.min(3, Math.floor(safeNumber(v)))])) : {};

  }));

  s.seed = safeNumber(raw.seed) || base.seed;
  s.practiceRuns = safeNumber(raw.practiceRuns);
  if (!object(s.practice) || !Array.isArray(s.practice.items)) s.practice = null;
  else {
    s.practice.items=s.practice.items.filter(item=>object(item)&&VOCABULARY.some(w=>w.id===item.id)&&['l2g','g2l'].includes(item.direction)).slice(0,8).map(item=>({...item,answer:String(item.answer||'').slice(0,120),responseMs:safeNumber(item.responseMs),attempts:safeNumber(item.attempts),helped:!!item.helped,done:!!item.done}));
    s.practice.index=Math.min(s.practice.items.length,Math.floor(safeNumber(s.practice.index)));
    s.practice.run=safeNumber(s.practice.run);
  }

}
function loadState() {
  storageNotice = '';

    const v2 = localStorage.getItem(STORAGE_KEY);
    if (v2) return validateState(JSON.parse(v2));
    const v1 = localStorage.getItem(LEGACY_KEY);
    return v1 ? migrateV1(JSON.parse(v1)) : null;

    storageNotice = 'Der lokale Spielstand konnte nicht gelesen werden. Er wurde nicht überschrieben. Eine Sicherungsdatei kann über „Spielstand laden“ importiert werden.';

  catch { storageNotice = 'Automatisches Speichern ist in diesem Browser nicht verfügbar. Sichere deinen Stand über Menü → Spielstand sichern.'; return false; }

// src/puzzleEngine.js




function getPuzzleData(state, p) {
  const raw = state.puzzleData[p.id] || {};
  // Retain object identity: live handlers and the activity clock share this state.
  const d = Object.assign(raw, { fields:{}, selections:{}, acceptedFields:[], acceptedGroups:[], attempts:{}, tab:0, responseTimes:{}, feedback:'', ...raw });
  for (const k of ['fields','selections','attempts','responseTimes']) if (!d[k] || typeof d[k]!=='object' || Array.isArray(d[k])) d[k] = {};
  for (const k of ['acceptedFields','acceptedGroups']) if (!Array.isArray(d[k])) d[k] = [];
  if (!Number.isFinite(d.tab)) d.tab = 0;
  state.puzzleData[p.id] = d;
  return d;
}
function activeDefinition(state,p) {
  if (p.id !== 'finalDispatch') return p;
  const d = getPuzzleData(state,p);
  if (!['swift','steady'].includes(d.variant)) {
    const score = ids=>ids.reduce((sum,id)=>sum+(state.diagnostics[id]?.incorrect||0)*3+(state.diagnostics[id]?.unresolved||0),0);
    d.variant = score(['gravis','acer','regius']) > score(['celer','audax','felix']) ? 'steady' : 'swift';
  }
  return finalDefinition(d.variant);
}
function orderedOptions(options, seed, salt) {
  let n = (Number(seed)||1) >>> 0;
  for (const ch of salt) n = (Math.imul(n,31)+ch.charCodeAt(0))>>>0;
  const result = [...options];
  for (let i=result.length-1;i>0;i--) {
    n = (Math.imul(n,1664525)+1013904223)>>>0;
    const j=n%(i+1); [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function fieldCorrect(f, value) {
  if (!isCorrectAnswer(f.word,f.direction,value)) return false;
  return !f.accepted || f.accepted.some(v=>normalizeAnswer(v)===normalizeAnswer(value));
}
function recordEvidence(state,p,d,id,item,direction,method,outcome,extra={}) {
  const hintLevel = state.hintsUsed[p.id]||0;
  recordAttempt(state.diagnostics,id,{context:p.id,item,direction,method,outcome,usedHint:hintLevel>0||!!d.solutionShown,
    hintLevel,responseMs:d.responseTimes[item]||0,retry:(d.attempts[item]||0)>0,...extra});
  if (outcome==='incorrect'||outcome==='unresolved') queueReview(state,id);
  else if (!needsReview(state.diagnostics[id])) state.reviewQueue = state.reviewQueue.filter(v=>v!==id);
}
function checkField(state,p,d,f) {
  if (d.acceptedFields.includes(f.id)) return true;
  const value=d.fields[f.id]||'';
  if (!String(value).trim()) return null;
  const correct=fieldCorrect(f,value);
  const contextMismatch=!correct&&isCorrectAnswer(f.word,f.direction,value);
  recordEvidence(state,p,d,f.word,f.id,f.direction,'active',correct?'correct':'incorrect',{reason:contextMismatch?'context-mismatch':''});
  d.attempts[f.id]=(d.attempts[f.id]||0)+1;
  d.responseTimes[f.id]=0;
  if (correct) d.acceptedFields.push(f.id);
  return correct;
}
function checkGroup(state,p,d,g,timed=false) {
  if(d.acceptedGroups.includes(g.id))return true;
  const chosen=g.options.find(v=>v.id===d.selections[g.id]);
  if(!chosen)return null;
  const correct=chosen.id===g.correct;
  const bad=chosen.contradicts||[];
  // Only one unambiguously violated lexical condition permits individual error
  // attribution. A multi-condition mismatch is explicitly unresolved, not N errors.
  for(const id of g.wordIds){
    const outcome=correct?'correct':bad.length===1&&bad[0]===id?'incorrect':'unresolved';
    recordEvidence(state,p,d,id,g.id,g.evidenceDirections?.[id]||g.direction,g.method,outcome,{timed,pooled:true});
  }
  d.attempts[g.id]=(d.attempts[g.id]||0)+1;
  d.responseTimes[g.id]=0;
  if(correct)d.acceptedGroups.push(g.id);
  return correct;
}
function allAnswered(p,d) { return p.fields.every(f=>d.acceptedFields.includes(f.id)||String(d.fields[f.id]||'').trim())&&p.groups.every(g=>d.acceptedGroups.includes(g.id)||g.options.some(o=>o.id===d.selections[g.id])); }
function allAccepted(p,d) { return p.fields.every(f=>d.acceptedFields.includes(f.id))&&p.groups.every(g=>d.acceptedGroups.includes(g.id)); }
function finishPuzzle(state,p) { solvePuzzle(state,p.id);if(p.reward)addInventory(state,p.reward); }
function revealSolution(state,p,d) {
  d.solutionShown=true;
  const pending=new Set([...p.fields.filter(f=>!d.acceptedFields.includes(f.id)).map(f=>f.word),...p.groups.filter(g=>!d.acceptedGroups.includes(g.id)).flatMap(g=>g.wordIds)]);
  for(const id of pending)recordAttempt(state.diagnostics,id,{context:p.id,item:'solution',method:'application',outcome:'exposure',usedHint:true});
  for(const f of p.fields)d.fields[f.id]=f.direction==='g2l'?VOCAB_BY_ID[f.word].latin:(f.accepted?.[0]||VOCAB_BY_ID[f.word].german[0]);
  for(const g of p.groups)d.selections[g.id]=g.correct;
  d.acceptedFields=p.fields.map(f=>f.id);d.acceptedGroups=p.groups.map(g=>g.id);
  if(d.timer)d.timer.running=false;
  finishPuzzle(state,p);
}
function timerState(state,d) {
  if(!d.timer||typeof d.timer!=='object'||Array.isArray(d.timer))d.timer={remainingMs:55000,started:false,running:false,expired:false,disabled:!state.timePressure,penalties:0};
  d.timer.remainingMs=Number.isFinite(d.timer.remainingMs)?Math.max(0,Math.min(55000,d.timer.remainingMs)):55000;
  return d.timer;
}
function advanceTimer(timer,deltaMs) {
  if(!timer.started||!timer.running||timer.expired||timer.disabled)return false;
  timer.remainingMs=Math.max(0,timer.remainingMs-Math.max(0,deltaMs));
  if(timer.remainingMs===0){timer.expired=true;timer.running=false;return true;}
  return false;
}
function penalizeTimer(timer) { if(!timer.running||timer.disabled||timer.expired)return false;timer.penalties++;return advanceTimer(timer,3000); }

function buildPractice(state) {
  const priority=s=>s.status===STATUS.NOT_MASTERED?100+s.incorrect:s.status===STATUS.UNTESTED?50:20+s.incorrect*3+s.unresolved;
  const words=VOCABULARY.filter(w=>calculateStatus(state.diagnostics[w.id])!==STATUS.SAFE)
    .sort((a,b)=>priority(state.diagnostics[b.id])-priority(state.diagnostics[a.id])).slice(0,8);
  state.practiceRuns++;
  return {run:state.practiceRuns,index:0,items:words.map(w=>{
    const events=state.diagnostics[w.id].events.filter(e=>e.method==='active'&&e.outcome==='correct'&&!e.usedHint&&!e.retry);
    const direction=events.filter(e=>e.direction==='l2g').length<=events.filter(e=>e.direction==='g2l').length?'l2g':'g2l';
    return {id:w.id,direction,answer:'',helped:false,attempts:0,done:false,responseMs:0,feedback:''};
  })};
}


// src/sound.js
let ctx = null;

function getContext() {
  if (!ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) { try { ctx = new AudioCtx(); } catch { return null; } }
  }
  return ctx;
}

function playSound(kind, enabled = true) {
  if (!enabled) return;
  const audio = getContext();
  if (!audio) return;
  if (audio.state === 'suspended') audio.resume().catch(() => {});
  const now = audio.currentTime;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const map = {
    tap: [320, 0.025, 0.025],
    success: [520, 0.08, 0.05],
    error: [150, 0.06, 0.04],
    unlock: [240, 0.12, 0.08],
    paper: [700, 0.035, 0.02]
  };
  const [freq, duration, volume] = map[kind] || map.tap;
  oscillator.type = kind === 'error' ? 'square' : 'sine';
  oscillator.frequency.setValueAtTime(freq, now);
  if (kind === 'success') oscillator.frequency.exponentialRampToValueAtTime(760, now + duration);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + duration + 0.01);
}

    <footer class="operation-controls"><span>${reconstruct?'Drei Merkmale. Erst danach lässt sich die Person auswählen.':pending?`${pending} Angaben fehlen noch im Auftrag.`:'Alle Angaben sind vorgemerkt. Prüfe den vollständigen Auftrag.'}</span><div class="control-buttons">${tabs.length>1&&!reconstruct?`<button class="secondary-btn" data-next-tab>${d.tab<tabs.length-1?'Nächste Station':'Zur Übersicht'}</button>`:''}<button class="primary-btn" data-check ${canSubmit?'':'disabled'}>${escapeHtml(label)}</button></div></footer>
    </section></div></div></section>`;
  world.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{tickActivity();d.tab=Number(btn.dataset.tab);persist();renderRoom(true);}));
  world.querySelector('[data-next-tab]')?.addEventListener('click',()=>{tickActivity();d.tab=(d.tab+1)%tabs.length;persist();renderRoom(true);});
  world.querySelectorAll('[data-select]').forEach(btn=>btn.addEventListener('click',()=>{
    tickActivity();d.selections[btn.dataset.group]=btn.dataset.select;d.feedback='Vorgemerkt. Der Auftrag ist noch nicht ausgeführt.';

  }));

  world.querySelector('[data-check]').addEventListener('click',()=>submitOperation(p,d,reconstruct));

function sceneClass(room){return({forum:'forum-scene',archive:'archive-scene',messengers:'messenger-scene',files:'files-scene',senate:'senate-scene',final:'final-scene'})[room]||'';}
function wireFields(world,p,d) {
  world.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('input',()=>{
    d.fields[input.dataset.field]=input.value;persist();
    const reconstruct=p.id==='finalDispatch'&&!p.fields.every(f=>d.acceptedFields.includes(f.id));
    const btn=world.querySelector('[data-check]');
    if(btn)btn.disabled=!(reconstruct?p.fields.every(f=>String(d.fields[f.id]||'').trim()):allAnswered(p,d));
  }));
  world.querySelector('[data-fields-form]')?.addEventListener('submit',e=>{
    e.preventDefault();
    const reconstruct=p.id==='finalDispatch'&&!p.fields.every(f=>d.acceptedFields.includes(f.id));
    if(reconstruct||allAnswered(p,d))submitOperation(p,d,reconstruct);
    else{
      const tabs=puzzleTabs(p);const next=tabs.findIndex(t=>t.group&&!d.selections[t.id]);
      if(next>=0){d.tab=next;persist();renderRoom(true);}else toast('Vervollständige noch die leeren Einträge.');
    }
  });
}
function submitOperation(p,d,reconstruct=false) {
  tickActivity();
  if(reconstruct){
    if(!p.fields.every(f=>String(d.fields[f.id]||'').trim()))return;
    for(const f of p.fields)checkField(state,p,d,f);
    if(p.fields.every(f=>d.acceptedFields.includes(f.id))){d.tab=1;d.feedback='Die Merkmale sind rekonstruiert. Kombiniere jetzt alle vier Auftragsteile.';sound('unlock');}
    else{d.feedback='Noch nicht alle Merkmale passen. Gesicherte Einträge bleiben erhalten.';sound('error');}
    persist();renderRoom(true);return;
  }
  if(!allAnswered(p,d)){toast('Im Auftrag fehlen noch Angaben.');return;}
  for(const f of p.fields)checkField(state,p,d,f);
  for(const g of p.groups)checkGroup(state,p,d,g);
  if(allAccepted(p,d)){finishPuzzle(state,p);persist();sound('unlock');render();return;}
  const tabs=puzzleTabs(p);
  d.tab=tabs.findIndex(t=>t.fields?!t.fields.every(f=>d.acceptedFields.includes(f.id)):!d.acceptedGroups.includes(t.id));
  d.feedback=p.id==='dossierInquiry'?'Der Befund enthält noch einen Widerspruch. Eine Wörterbuchbedeutung muss hier auch zum beschriebenen Kontext passen.':'Der Auftrag widerspricht noch mindestens einer Quellenangabe. Gesicherte Stationen bleiben erhalten; prüfe die noch offenen.';
  persist();sound('error');renderRoom(true);
}
function renderTimedRoom(world,p) {
  const d=getPuzzleData(state,p),t=timerState(state,d);
  if(!t.started){
    world.innerHTML=`<section class="scene senate-scene"><div class="senate-depth" aria-hidden="true"></div><article class="timing-brief"><p class="eyebrow">${escapeHtml(p.kicker)}</p><h1>${escapeHtml(p.title)}</h1><p>${escapeHtml(p.story)}</p><div class="timing-seal" aria-hidden="true">${p.timedSeconds}</div><p>Drei kurze Anweisungen. ${p.timedSeconds} Sekunden aktives Zeitfenster. Ein Fehlversuch kostet drei Sekunden; der Stand bleibt erhalten.</p><p>Menü, Hinweise und ein inaktiver Tab pausieren die Uhr. Nach Ablauf kannst du ohne Zeitlimit weiterarbeiten.</p><div class="landing-actions"><button class="primary-btn" data-start-timed>${state.timePressure?'Zeitfenster öffnen':'Ohne Zeitdruck beginnen'}</button>${state.timePressure?'<button class="secondary-btn" data-start-untimed>Ohne Zeitdruck beginnen</button>':''}</div></article></section>`;
    const begin=untimed=>{t.started=true;t.disabled=untimed||!state.timePressure;t.running=!t.disabled;persist();renderRoom(true);};
    world.querySelector('[data-start-timed]').addEventListener('click',()=>begin(false));
    world.querySelector('[data-start-untimed]')?.addEventListener('click',()=>begin(true));

  }
  const g=p.groups.find(g=>!d.acceptedGroups.includes(g.id));
  if(!g){finishPuzzle(state,p);persist();render();return;}
  world.innerHTML=`<section class="scene senate-scene operation-scene"><div class="senate-depth" aria-hidden="true"></div><div class="timed-wrap"><header class="timed-header"><div><p class="eyebrow">Einsatztafel · ${d.acceptedGroups.length+1} von ${p.groups.length}</p><h1>Die Wache kommt zurück.</h1></div><div class="timer-display" data-timer aria-live="off"></div></header>
    <div class="operation-board timed-board">${choiceGroup(state,p,d,g)}<p class="reading-key">NON = nicht. Ein Fehlversuch stoppt die Mission nicht.</p><div class="operation-feedback" role="status">${escapeHtml(d.feedback||'Wähle die vollständige Handlung, nicht nur ein passendes Teilstück.')}</div><footer class="operation-controls"><button class="secondary-btn" data-disable-time ${t.disabled||t.expired?'disabled':''}>Zeitdruck ausschalten</button><button class="primary-btn" data-execute ${d.selections[g.id]?'':'disabled'}>Anweisung ausführen</button></footer></div></div></section>`;
  world.querySelectorAll('[data-select]').forEach(btn=>btn.addEventListener('click',()=>{tickActivity();d.selections[g.id]=btn.dataset.select;sound('paper');persist();renderRoom();}));
  world.querySelector('[data-disable-time]').addEventListener('click',()=>{tickActivity();t.disabled=true;t.running=false;d.feedback='Der Einsatz läuft ohne Zeitlimit weiter. Das zählt nicht als Vokabelfehler.';persist();renderRoom();});
  world.querySelector('[data-execute]').addEventListener('click',()=>{
    tickActivity();const ok=checkGroup(state,p,d,g,t.running&&!t.expired&&!t.disabled);
    if(ok){d.feedback='Diese Anweisung ist ausgeführt. Die nächste Tafel liegt bereit.';sound('tap');}
    else{const expired=penalizeTimer(t);d.feedback=expired?'Die Wache zieht vorbei. Prüfe die Anweisung jetzt ohne Zeitlimit.':'Die Handlung widerspricht dem Auftrag. Prüfe Umfang, Empfänger und Tätigkeit noch einmal.';sound('error');}
    if(allAccepted(p,d)){t.running=false;finishPuzzle(state,p);persist();sound('unlock');render();}else{persist();renderRoom(true);}
  });
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const target=app.querySelector('[data-timer]');if(!target)return;
  const d=state.puzzleData.senateSignal;const t=d?.timer;if(!t)return;
  target.textContent=t.expired?'Wache vorbei · ohne Zeitlimit':t.disabled?'Ohne Zeitlimit':`${Math.ceil(t.remainingMs/1000)} s`;
  const disableButton=app.querySelector('[data-disable-time]');if(disableButton)disableButton.disabled=t.disabled||t.expired;
  target.classList.toggle('timer-low',!t.expired&&!t.disabled&&t.remainingMs<=15000);
}
function goToRoom(id) {
  tickActivity();closeInspection(false);
  const next=ROOM_ORDER.indexOf(id),current=ROOM_ORDER.indexOf(state.currentRoom);
  if(next!==current+1)return;
  const base=Object.values(PUZZLES).find(p=>p.room===state.currentRoom);
  if(base&&!isSolved(state,base.id))return;
  state.currentRoom=id;state.selectedInventoryItem=null;
  if(id==='results')state.completed=true;
  persist();sound('tap');render();app.querySelector('#world')?.focus({preventScroll:true});
}

function solutionTranscript(p) {
  const entries=[...p.fields.map(f=>({title:f.prompt,answer:f.direction==='g2l'?VOCAB_BY_ID[f.word].latin:(f.accepted?.[0]||VOCAB_BY_ID[f.word].german[0])})),...p.groups.map(g=>{

  })];

function exportJSON(value,filename) {
  persist();const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  toast('Die Sicherungsdatei wurde zum Speichern bereitgestellt.');
}
function importSave() {
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.setAttribute('aria-label','Spielstanddatei auswählen');
  input.addEventListener('change',async()=>{
    const file=input.files?.[0];if(!file)return;
    try{
      if(file.size>2*1024*1024)throw new Error('Die Datei ist größer als 2 MB.');
      const candidate=validateState(JSON.parse(await file.text()));
      if(state.started&&!window.confirm('Aktuellen V2-Stand durch diese Sicherung ersetzen?'))return;
      closeInspection(false);state=candidate;screen='landing';lastClock=performance.now();persist();render();
    }catch(e){const message=`Spielstand nicht geladen: ${e.message}`;if(screen==='landing'){const box=app.querySelector('#storage-notice');box.hidden=false;box.textContent=message;}else toast(message);}
  });
  input.click();
}

function startPracticeMode() {

    <p class="practice-feedback" role="status">${escapeHtml(item.feedback||'')}</p>${item.helped?`<p class="shown-answer">Lösung: <strong>${escapeHtml(answer)}</strong>. Weitere Antworten auf diesen Eintrag gelten als unterstützt.</p>`:''}

    });
    root.querySelector('[data-practice-help]')?.addEventListener('click',()=>{
      if(!item.helped){item.helped=true;markHint(state.diagnostics,[item.id]);recordAttempt(state.diagnostics,item.id,{context:`practice-${plan.run}`,item:`${item.id}-${plan.index}`,direction:item.direction,method:'active',outcome:'exposure',usedHint:true});}
      persist();openPractice();
    });
    const next=()=>{plan.index++;persist();openPractice();};
    root.querySelector('[data-practice-next]')?.addEventListener('click',next);
    root.querySelector('[data-practice-skip]')?.addEventListener('click',next);
  },'practice');
}

function openInspection(title,content,setup,kind='inspection') {
  tickActivity();
  const oldFocus=modalOpen?restoreFocus:document.activeElement;
  closeInspection(false);restoreFocus=oldFocus;
  const root=app.querySelector('#inspection-root');if(!root)return;
  modalOpen=true;modalKind=kind;
  if(state.started)saveState(state);
  root.innerHTML=`<div class="inspection-overlay" role="dialog" aria-modal="true" aria-labelledby="inspection-title"><div class="inspection-backdrop" data-backdrop></div><section class="inspection-card"><header><h1 id="inspection-title">${escapeHtml(title)}</h1><button class="close-btn" data-close aria-label="Schließen">×</button></header><div class="inspection-content">${content}</div></section></div>`;
  for(const el of app.querySelectorAll('.topbar,.world,.inventory-bar')){el.inert=true;el.setAttribute('aria-hidden','true');}
  const overlay=root.querySelector('.inspection-overlay');
  root.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeInspection()));
  root.querySelector('[data-backdrop]').addEventListener('click',()=>closeInspection());
  const keyHandler=e=>{
    if(e.key==='Escape'){e.preventDefault();closeInspection();return;}
    if(e.key!=='Tab')return;
    const focusables=[...overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);
    const first=focusables[0],last=focusables.at(-1);if(!first)return;
    if(e.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){e.preventDefault();first.focus();}
  };
  document.addEventListener('keydown',keyHandler);inspectionCleanup=()=>document.removeEventListener('keydown',keyHandler);
  setup?.(overlay);requestAnimationFrame(()=>overlay.classList.add('open'));
  root.querySelector('.close-btn')?.focus({preventScroll:true});
}
function closeInspection(restore=true) {
  if(inspectionCleanup)inspectionCleanup();inspectionCleanup=null;
  const wasKind=modalKind;
  modalOpen=false;modalKind='';lastClock=performance.now();
  const root=app.querySelector('#inspection-root');if(root)root.innerHTML='';
  for(const el of app.querySelectorAll('.topbar,.world,.inventory-bar')){el.inert=false;el.removeAttribute('aria-hidden');}
  if(restore&&restoreFocus?.isConnected)restoreFocus.focus({preventScroll:true});
  if(restore&&wasKind==='practice'){saveState(state);renderRoom();}
}
function toast(message) {
  const root=app.querySelector('#toast-root');if(!root)return;
  clearTimeout(toastTimeout);root.innerHTML=`<div class="toast">${escapeHtml(message)}</div>`;
  toastTimeout=setTimeout(()=>{if(root.isConnected)root.innerHTML='';},4200);
}
window.addEventListener('pagehide',()=>{tickActivity();if(state.started)saveState(state);});
window.addEventListener('beforeunload',()=>{tickActivity();if(state.started)saveState(state);});
document.addEventListener('visibilitychange',()=>{tickActivity();lastClock=performance.now();if(state.started)saveState(state);});
window.setInterval(()=>{tickActivity();if(screen==='game'&&state.started&&performance.now()-lastAutoSave>=1000){lastAutoSave=performance.now();saveState(state);}},250);
render();

})();</script></body></html>
